<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BerryWeb - Dashboard</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #00e676;
            --hover-overlay: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .app-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            margin: 14px 16px 0 16px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .profile-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: #1e1e1e;
            color: var(--accent-green);
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
            border: 2px solid var(--border-color);
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--card-bg);
            background-color: #00e676;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.6); }
            70% { box-shadow: 0 0 0 6px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        .user-details h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .view-profile {
            font-size: 12px;
            color: var(--accent-green);
            cursor: pointer;
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-inbox {
            background-color: #1e1e1e;
            color: var(--text-main);
            position: relative;
        }

        .inbox-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
            display: none;
        }

        .btn-logout {
            background-color: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }

        .btn:active {
            opacity: 0.7;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-green);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: 6px;
            max-height: 180px;
            overflow-y: auto;
            display: none;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .search-result-item {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .result-username {
            font-size: 14px;
            font-weight: 600;
        }

        .add-btn {
            background-color: var(--accent-green);
            color: #0a0a0a;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .add-btn.pending {
            background-color: #262626;
            color: #888;
            cursor: default;
        }

        .friend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .friend-item:last-child {
            border-bottom: none;
        }

        .friend-item:active {
            background-color: var(--hover-overlay);
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .friend-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .friend-avatar {
            width: 42px;
            height: 42px;
            background-color: #1e1e1e;
            color: var(--accent-green);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
        }

        .friend-details {
            flex: 1;
            min-width: 0;
        }

        .friend-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .friend-name.unread {
            color: #ffffff;
            font-weight: 800;
        }

        .friend-last-msg {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .friend-last-msg.unread {
            color: var(--accent-green);
            font-weight: 600;
        }

        .friend-meta-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            padding-left: 10px;
            flex-shrink: 0;
        }

        /* High-visibility Facebook-style Red Badge */
        .unread-badge {
            background-color: #ff3b30 !important;
            color: #ffffff !important;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.6);
            display: inline-block;
        }

        .message-action {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .no-friends {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 24px 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-text">BERRYWEB</div>
        </header>

        <div class="card profile-card">
            <div class="profile-left">
                <div class="avatar-container">
                    <div class="avatar" id="userAvatar">U</div>
                    <div class="status-dot"></div>
                </div>
                <div class="user-details">
                    <h3 id="usernameDisplay">User</h3>
                    <div class="view-profile" onclick="alert('Profile settings coming soon!')">View Profile</div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-inbox" onclick="window.location.href='/inbox'">
                    Inbox
                    <span id="inboxBadge" class="inbox-badge">0</span>
                </button>
                <button class="btn btn-logout" onclick="logout()">Log Out</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Find Users</div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search username..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="secure_search_field_xyz" readonly onfocus="this.removeAttribute('readonly');">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <div class="card" style="flex: 1; margin-bottom: 16px;">
            <div class="card-title">My Chats</div>
            <ul id="friendList" class="friend-list">
                <li class="no-friends" id="loadingText">Loading chats...</li>
            </ul>
        </div>
    </div>

    <script>
        // --- Permanent Security & Chrome Storage Persistence ---
        let currentUsername = localStorage.getItem('berry_session_user') || localStorage.getItem('username') || sessionStorage.getItem('berry_user');
        
        if (!currentUsername) {
            window.location.replace('/login');
        } else {
            // Lock session permanently across all permanent browser storage vectors so closing Chrome or reloading never wipes it
            localStorage.setItem('berry_session_user', currentUsername);
            localStorage.setItem('username', currentUsername);
            
            // Intercept phone hardware back button so it redirects or locks you on the dashboard instead of logging out
            history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', function () {
                history.pushState(null, null, window.location.href);
            });

            document.getElementById('usernameDisplay').textContent = currentUsername;
            document.getElementById('userAvatar').textContent = currentUsername.charAt(0).toUpperCase();
        }

        function logout() {
            localStorage.removeItem('berry_session_user');
            localStorage.removeItem('username');
            sessionStorage.clear();
            window.location.replace('/login');
        }
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();

            if (query.length === 0) {
                searchResults.style.display = 'none';
                searchResults.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();

                searchResults.innerHTML = '';
                if (data.users && data.users.length > 0) {
                    searchResults.style.display = 'block';
                    data.users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        
                        let btnHtml = '';
                        if (user.status === 'friends') {
                            btnHtml = `<button class="add-btn pending" disabled>Friends</button>`;
                        } else if (user.status === 'pending_sent') {
                            btnHtml = `<button class="add-btn pending" disabled>Pending</button>`;
                        } else {
                            btnHtml = `<button onclick="sendFriendRequest('${user.username}', this)" class="add-btn">Add</button>`;
                        }

                        div.innerHTML = `<span class="result-username">@${user.username}</span> ${btnHtml}`;
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'block';
                    searchResults.innerHTML = `<div style="padding:14px; color:#888; font-size:13px; text-align:center;">No users found</div>`;
                }
            } catch (err) {
                searchResults.style.display = 'none';
            }
        });

        async function sendFriendRequest(friendUsername, btnElement) {
            try {
                const res = await fetch('/api/send-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, friendUsername })
                });
                const data = await res.json();
                if (data.success) {
                    btnElement.textContent = 'Pending';
                    btnElement.classList.add('pending');
                    btnElement.disabled = true;
                }
            } catch (err) {}
        }

        let isFirstLoad = true;

        async function loadFriends() {
            const friendListEl = document.getElementById('friendList');
            try {
                // Fetch friends list and unread message counters simultaneously
                const [friendsRes, unreadRes] = await Promise.all([
                    fetch(`/api/friends?user=${encodeURIComponent(currentUsername)}`),
                    fetch(`/api/unread-counts?user=${encodeURIComponent(currentUsername)}`)
                ]);
                
                const data = await friendsRes.json();
                const unreadData = await unreadRes.json();
                const unreadCounts = unreadData.counts || {};

                if (data.friends && data.friends.length > 0) {
                    if (isFirstLoad || friendListEl.children.length !== data.friends.length) {
                        friendListEl.innerHTML = '';
                        isFirstLoad = false;
                    }

                    for (let i = 0; i < data.friends.length; i++) {
                        const friend = data.friends[i];
                        let lastMsgText = "Tap to start chatting";
                        const unreadCount = unreadCounts[friend.username] || 0;

                        try {
                            const msgRes = await fetch(`/api/messages?user=${encodeURIComponent(currentUsername)}&friend=${encodeURIComponent(friend.username)}`);
                            const msgData = await msgRes.json();
                            if (msgData.messages && msgData.messages.length > 0) {
                                const messages = msgData.messages;
                                const latest = messages[messages.length - 1];
                                
                                if (latest.image && !latest.text) {
                                    lastMsgText = "📷 Sent a photo";
                                } else {
                                    lastMsgText = latest.text;
                                }
                            }
                        } catch (e) {}

                        let existingItem = document.getElementById(`friend-row-${friend.username}`);
                        
                        if (!existingItem) {
                            existingItem = document.createElement('li');
                            existingItem.className = 'friend-item';
                            existingItem.id = `friend-row-${friend.username}`;
                            existingItem.onclick = async () => {
                                // Clear unread counter on server instantly when chat is clicked
                                try {
                                    await fetch('/api/mark-read', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ user: currentUsername, friend: friend.username })
                                    });
                                } catch(err){}
                                window.location.href = `/chat?friend=${encodeURIComponent(friend.username)}`;
                            };
                            friendListEl.appendChild(existingItem);
                        }
                        
                        const unreadClass = unreadCount > 0 ? 'unread' : '';
                        const badgeHtml = unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : `<div class="message-action">Chat</div>`;

                        existingItem.innerHTML = `
                            <div class="friend-info">
                                <div class="friend-avatar-wrapper">
                                    <div class="friend-avatar">${friend.username.charAt(0)}</div>
                                    <div class="status-dot"></div>
                                </div>
                                <div class="friend-details">
                                    <div class="friend-name ${unreadClass}">@${friend.username}</div>
                                    <span class="friend-last-msg ${unreadClass}">${escapeHtml(lastMsgText)}</span>
                                </div>
                            </div>
                            <div class="friend-meta-right">
                                ${badgeHtml}
                            </div>
                        `;
                    }
                } else {
                    friendListEl.innerHTML = `<li class="no-friends">No active chats. Search above to add friends!</li>`;
                }
            } catch (err) {
                if (isFirstLoad) {
                    friendListEl.innerHTML = `<li class="no-friends">Failed to load chats.</li>`;
                }
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        async function checkInboxCount() {
            try {
                const res = await fetch(`/api/inbox-count?user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                const badge = document.getElementById('inboxBadge');
                if (data.count > 0) {
                    badge.textContent = data.count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {}
        }

        loadFriends();
        checkInboxCount();
        setInterval(() => {
            loadFriends();
            checkInboxCount();
        }, 3000);
    </script>
</body>
</html>
