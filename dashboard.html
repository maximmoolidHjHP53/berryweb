<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BerryWeb</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1621;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: #17212b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: #2fa572;
            color: #0e1621;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
        }

        .user-details h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
        }

        .user-details span {
            font-size: 13px;
            color: #2fa572;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-inbox-wrapper {
            position: relative;
        }

        .btn-inbox {
            background-color: #2b3b4c;
            color: #f5f5f5;
        }

        /* Red Unread Counter Badge for Inbox */
        .badge-counter {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #eb5757;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
            display: none;
        }

        .btn-logout {
            background-color: #eb5757;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.85;
        }

        h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #8a96a3;
            letter-spacing: 0.5px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background-color: #0e1621;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #f5f5f5;
            box-sizing: border-box;
            font-size: 14px;
        }

        .search-input:focus {
            border-color: #2fa572;
            outline: none;
        }

        .search-results {
            background: #0e1621;
            border: 1px solid #374151;
            border-radius: 8px;
            margin-top: 5px;
            max-height: 160px;
            overflow-y: auto;
            display: none;
        }

        .search-result-item {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }

        .search-result-item button {
            background: #2fa572;
            color: #0e1621;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-result-item button.pending {
            background: #4b5563;
            color: #d1d5db;
            cursor: default;
        }

        /* Friend List Section */
        .friend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .friend-item:hover {
            background: rgba(255,255,255,0.02);
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .friend-avatar {
            width: 36px;
            height: 36px;
            background-color: #374151;
            color: #2fa572;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
        }

        .friend-meta span {
            display: block;
        }

        .friend-name {
            font-size: 14px;
            font-weight: 600;
        }

        .friend-action {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-badge {
            background-color: #eb5757;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
            display: none;
        }

        .msg-icon-text {
            font-size: 12px;
            color: #2fa572;
            font-weight: 600;
        }

        .no-friends {
            color: #8a96a3;
            font-size: 13px;
            margin: 0;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="card profile-header">
            <div class="profile-info">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <h3 id="usernameDisplay">User</h3>
                    <span onclick="alert('Profile settings coming soon!')">View Profile</span>
                </div>
            </div>
            <div class="action-buttons">
                <div class="btn-inbox-wrapper">
                    <button class="btn btn-inbox" onclick="openInbox()">Inbox</button>
                    <span id="inboxBadge" class="badge-counter">0</span>
                </div>
                <button class="btn btn-logout" onclick="logout()">Log Out</button>
            </div>
        </div>

        <div class="card">
            <h4>FIND USERS & ADD FRIENDS</h4>
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="@ search username...">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <div class="card">
            <h4>MY FRIENDLIST</h4>
            <ul id="friendList" class="friend-list">
                <li class="no-friends">Loading friendlist...</li>
            </ul>
        </div>
    </div>

    <script>
        const currentUsername = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUsername) {
            window.location.href = '/login';
        } else {
            document.getElementById('usernameDisplay').textContent = currentUsername;
            document.getElementById('userAvatar').textContent = currentUsername.charAt(0).toUpperCase();
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        function openInbox() {
            window.location.href = '/inbox';
        }

        // Live Search Input Handler
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            
            // If search bar is completely blank, hide results dropdown
            if (query.length === 0) {
                searchResults.style.display = 'none';
                searchResults.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();

                searchResults.innerHTML = '';
                if (data.users && data.users.length > 0) {
                    searchResults.style.display = 'block';
                    data.users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        
                        let btnHtml = '';
                        if (user.status === 'friends') {
                            btnHtml = `<button class="pending" disabled>Friends</button>`;
                        } else if (user.status === 'pending_sent') {
                            btnHtml = `<button class="pending" disabled>Pending</button>`;
                        } else if (user.status === 'pending_received') {
                            btnHtml = `<button class="pending" disabled>Request Sent You</button>`;
                        } else {
                            btnHtml = `<button onclick="sendFriendRequest('${user.username}', this)">Add Friend</button>`;
                        }

                        div.innerHTML = `<span>@${user.username}</span> ${btnHtml}`;
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'block';
                    searchResults.innerHTML = `<div style="padding:10px; color:#8a96a3; font-size:13px; text-align:center;">No users found</div>`;
                }
            } catch (err) {
                console.error("Search error", err);
            }
        });

        // Send Friend Request / Turn to Pending
        async function sendFriendRequest(friendUsername, btnElement) {
            try {
                const res = await fetch('/api/send-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, friendUsername })
                });
                const data = await res.json();
                if (data.success) {
                    btnElement.textContent = 'Pending';
                    btnElement.className = 'pending';
                    btnElement.disabled = true;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Error sending request.");
            }
        }

        // Load Confirmed Friendlist (Only True Friends)
        async function loadFriends() {
            const friendListEl = document.getElementById('friendList');
            try {
                const res = await fetch(`/api/friends?user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();

                friendListEl.innerHTML = '';
                if (data.friends && data.friends.length > 0) {
                    data.friends.forEach(friend => {
                        const li = document.createElement('li');
                        li.className = 'friend-item';
                        li.onclick = () => window.location.href = `/chat?friend=${encodeURIComponent(friend.username)}`;
                        
                        li.innerHTML = `
                            <div class="friend-info">
                                <div class="friend-avatar">${friend.username.charAt(0)}</div>
                                <div class="friend-meta">
                                    <span class="friend-name">@${friend.username}</span>
                                </div>
                            </div>
                            <div class="friend-action">
                                <span class="msg-badge" id="badge-${friend.username}">${friend.unreadCount || 0}</span>
                                <span class="msg-icon-text">Message</span>
                            </div>
                        `;
                        friendListEl.appendChild(li);

                        if (friend.unreadCount > 0) {
                            document.getElementById(`badge-${friend.username}`).style.display = 'inline-block';
                        }
                    });
                } else {
                    friendListEl.innerHTML = `<li class="no-friends">No friends added yet. Search above to connect!</li>`;
                }
            } catch (err) {
                friendListEl.innerHTML = `<li class="no-friends">Failed to load friendlist.</li>`;
            }
        }

        // Check Inbox Notification Badge Count
        async function checkInboxBadge() {
            try {
                const res = await fetch(`/api/inbox-count?user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                const badge = document.getElementById('inboxBadge');
                if (data.count > 0) {
                    badge.textContent = data.count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {}
        }

        loadFriends();
        checkInboxBadge();
        setInterval(checkInboxBadge, 5000); // Check notifications live every 5s
    </script>
</body>
</html>
