<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-card h2 { font-size: 1.4rem; }
        .nav-btns { display: flex; gap: 10px; }

        .btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--accent-green-hover); }
        .btn-danger { background: #eb5757; }
        .btn-danger:hover { background: #d33b3b; }

        .section-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .section-card h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .list-item {
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .list-item:hover { border-color: var(--accent-green); background: var(--bg-tertiary); }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .username-text {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .message-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .unread-badge {
            background: var(--accent-green);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: none;
            box-shadow: 0 2px 8px rgba(47, 165, 114, 0.4);
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header-card { flex-direction: column; gap: 14px; align-items: flex-start; }
            .nav-btns { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-card">
            <h2>Welcome, <span id="displayUsername">User</span></h2>
            <div class="nav-btns">
                <button onclick="logout()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-user-group"></i> My Friends</h3>
            <div class="list-container" id="friendsList">
                <div style="color: var(--text-muted); text-align: center; padding: 10px;">Loading friends...</div>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-user-plus"></i> Find Users</h3>
            <div class="list-container" id="allUsersList">
                <div style="color: var(--text-muted); text-align: center; padding: 10px;">Loading users...</div>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-bell"></i> Friend Requests</h3>
            <div class="list-container" id="requestsList">
                <div style="color: var(--text-muted); text-align: center; padding: 10px;">No pending requests.</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUser) window.location.href = '/login';

        document.getElementById('displayUsername').textContent = currentUser;

        let unreadCounts = {};
        let lastMessages = {};

        function loadDashboardData() {
            socket.emit('get_user_data', currentUser);
            socket.emit('get_all_users');
        }

        socket.on('user_data_response', (data) => {
            renderFriends(data.friends || []);
            renderRequests(data.friendRequests || []);
        });

        let cachedAllUsers = [];
        socket.on('all_users_list', (users) => {
            cachedAllUsers = users;
            socket.emit('get_user_data', currentUser);
        });

        socket.on('refresh_friends_' + currentUser, loadDashboardData);
        socket.on('refresh_requests_' + currentUser, loadDashboardData);

        // Real-time message listener for indicator updates & 5-letter preview
        socket.on('receive_message', (data) => {
            const otherUser = data.sender === currentUser ? data.receiver : data.sender;
            
            if (data.receiver === currentUser) {
                unreadCounts[otherUser] = (unreadCounts[otherUser] || 0) + 1;
            }

            if (data.sender === otherUser || data.receiver === otherUser) {
                lastMessages[otherUser] = data.message.substring(0, 5);
                
                const previewEl = document.getElementById(`preview_${otherUser}`);
                if (previewEl) {
                    previewEl.textContent = lastMessages[otherUser];
                }

                const badgeEl = document.getElementById(`badge_${otherUser}`);
                if (badgeEl && unreadCounts[otherUser] > 0) {
                    badgeEl.textContent = unreadCounts[otherUser];
                    badgeEl.style.display = 'inline-block';
                }
            }
        });

        function renderFriends(friends) {
            const container = document.getElementById('friendsList');
            if (friends.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">No friends added yet.</div>`;
                return;
            }

            container.innerHTML = '';
            friends.forEach(friend => {
                const count = unreadCounts[friend] || 0;
                const snippet = lastMessages[friend] || 'Tap to chat';

                const div = document.createElement('div');
                div.className = 'list-item';
                // Direct jump to chat box when clicking friend box
                div.onclick = () => { window.location.href = `/chat?with=${friend}`; };
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${friend.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${friend}</div>
                            <div class="message-preview" id="preview_${friend}">${snippet}</div>
                        </div>
                    </div>
                    <div class="friend-actions" onclick="event.stopPropagation()">
                        <div class="unread-badge" id="badge_${friend}" style="display: ${count > 0 ? 'inline-block' : 'none'};">${count}</div>
                        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="window.location.href='/chat?with=${friend}'"><i class="fa-solid fa-comment"></i> Chat</button>
                    </div>
                `;
                container.appendChild(div);
            });

            renderAllUsers(cachedAllUsers, friends, []);
        }

        function renderAllUsers(users, friends, requests) {
            const container = document.getElementById('allUsersList');
            const availableUsers = users.filter(u => u !== currentUser && !friends.includes(u) && !requests.includes(u));

            if (availableUsers.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">No other users found.</div>`;
                return;
            }

            container.innerHTML = '';
            availableUsers.force && availableUsers.forEach(user => {}); // safety
            availableUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.onclick = null; // Don't redirect on non-friend boxes
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${user.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${user}</div>
                        </div>
                    </div>
                    <div class="friend-actions">
                        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="sendRequest('${user}')"><i class="fa-solid fa-user-plus"></i> Add</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderRequests(requests) {
            const container = document.getElementById('requestsList');
            if (requests.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">No pending requests.</div>`;
                return;
            }

            container.innerHTML = '';
            requests.forEach(requester => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.onclick = null;
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${requester.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${requester}</div>
                        </div>
                    </div>
                    <div class="friend-actions">
                        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="respondRequest('${requester}', 'accept')">Accept</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function sendRequest(receiver) {
            socket.emit('send_friend_request', { sender: currentUser, receiver });
            loadDashboardData();
        }

        function respondRequest(requester, action) {
            socket.emit('respond_friend_request', { username: currentUser, requester, action });
            loadDashboardData();
        }

        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('berry_user');
            window.location.href = '/login';
        }

        loadDashboardData();
    </script>
</body>
</html>
