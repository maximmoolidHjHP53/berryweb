<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb Messenger - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-blue: #2fa572;
            --accent-hover: #37b880;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-elevation: 0 12px 40px rgba(0, 0, 0, 0.6);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: var(--bg-primary);
        }

        /* Full Width Telegram Style Layout */
        .sidebar {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
        }

        /* Ultra Realistic Header */
        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(23, 33, 43, 0.95);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 50;
        }

        .user-profile-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 4px;
            border-radius: 30px;
            transition: var(--transition-smooth);
        }

        .user-profile-preview:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2fa572, #1b6343);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 4px 12px rgba(47, 165, 114, 0.3);
            transition: var(--transition-smooth);
            position: relative;
        }

        .avatar-circle:hover {
            transform: scale(1.05);
        }

        .user-identity h3 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .user-identity span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        /* Settings Icon Button */
        .settings-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: var(--transition-smooth);
        }

        .settings-btn:hover {
            background: rgba(47, 165, 114, 0.15);
            color: var(--accent-blue);
            border-color: rgba(47, 165, 114, 0.3);
            transform: rotate(90deg) scale(1.05);
        }

        /* Settings Dropdown Box Fixed Above Layout Layers */
        .settings-dropdown {
            position: absolute;
            top: 60px;
            right: 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            width: 220px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            z-index: 99999;
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px) scale(0.95);
            transition: var(--transition-smooth);
            backdrop-filter: blur(20px);
        }

        .settings-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .logout-trigger-btn {
            width: 100%;
            background: rgba(235, 87, 87, 0.1);
            border: 1px solid rgba(235, 87, 87, 0.2);
            color: #eb5757;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-smooth);
        }

        .logout-trigger-btn:hover {
            background: #eb5757;
            color: white;
            box-shadow: 0 4px 15px rgba(235, 87, 87, 0.4);
            transform: translateY(-2px);
        }

        /* Ultra Realistic Search Bar Section */
        .search-section {
            padding: 14px 20px;
            background: transparent;
        }

        .search-bar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            border-radius: 14px;
            padding: 0 14px;
            transition: var(--transition-smooth);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }

        .search-bar-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(47, 165, 114, 0.15), inset 0 2px 6px rgba(0,0,0,0.4);
        }

        /* Permanent Intact At-Symbol Prefix */
        .search-permanent-prefix {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
            user-select: none;
            pointer-events: none;
            padding-right: 8px;
            border-right: 1px solid var(--border-glass);
            margin-right: 10px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 11px 0;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Global Users / Friends Scroll Area */
        .contacts-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 16px 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .contacts-scroll-area::-webkit-scrollbar {
            width: 5px;
        }

        .contacts-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 10px 12px;
            font-weight: 600;
        }

        /* Telegram Style User Card */
        .contact-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-bottom: 6px;
            background: var(--bg-primary);
            border: 1px solid var(--border-glass);
            position: relative;
        }

        .contact-card:hover {
            background: var(--bg-tertiary);
            border-color: rgba(47, 165, 114, 0.4);
            transform: translateX(4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .contact-avatar-wrapper {
            position: relative;
        }

        .contact-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #242f3d, #17212b);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        /* Active Green Circle Status Indicator */
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
            background-color: #27ae60;
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.6);
        }

        .contact-info {
            flex: 1;
        }

        .contact-info h4 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .contact-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.1);
        }

        /* Logout Confirmation Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            width: 360px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow-elevation);
            transform: scale(0.85) translateY(20px);
            transition: var(--transition-smooth);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(235, 87, 87, 0.12);
            color: #eb5757;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 18px auto;
        }

        .modal-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-stay {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
        }

        .btn-stay:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .btn-confirm-logout {
            background: #eb5757;
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(235, 87, 87, 0.35);
        }

        .btn-confirm-logout:hover {
            background: #d44343;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(235, 87, 87, 0.45);
        }

        /* Spinner Animation */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-preview" onclick="navigateToProfile()" title="View Profile">
                    <div class="avatar-circle" id="userInitial">U</div>
                    <div class="user-identity">
                        <h3 id="displayUsername">Loading...</h3>
                        <span>My Account</span>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="settings-btn" id="settingsToggleBtn" title="Settings">
                        <i class="fa-solid fa-gear"></i>
                    </button>

                    <div class="settings-dropdown" id="settingsDropdownMenu">
                        <button class="logout-trigger-btn" id="logoutModalOpenBtn">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
                        </button>
                    </div>
                </div>
            </div>

            <div class="search-section">
                <div class="search-bar-wrapper">
                    <div class="search-permanent-prefix">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 0.8rem;"></i>
                        <span>@</span>
                    </div>
                    <input type="text" id="userSearchInput" class="search-input" placeholder="Search all users globally...">
                </div>
            </div>

            <div class="contacts-scroll-area" id="contactsContainer">
                </div>
        </div>
    </div>

    <div class="modal-overlay" id="logoutModalOverlay">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Terminate Session?</h3>
            <p>Are you sure you want to log out of your Berryweb account? Yes to continue, No to stay in the site.</p>
            <div class="modal-actions">
                <button class="modal-btn btn-stay" id="modalStayBtn">
                    <span>No</span>
                </button>
                <button class="modal-btn btn-confirm-logout" id="modalConfirmLogoutBtn">
                    <span>Yes, continue</span>
                </button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Robust session verification matching all possible keys
        const currentUser = localStorage.getItem('berry_user') || localStorage.getItem('username') || localStorage.getItem('chat_user');
        
        if (!currentUser) {
            window.location.href = '/login';
        } else {
            localStorage.setItem('berry_user', currentUser);
            localStorage.setItem('username', currentUser);
            localStorage.setItem('chat_user', currentUser);
        }

        // Initialize UI Elements safely
        document.getElementById('displayUsername').textContent = currentUser;
        document.getElementById('userInitial').textContent = currentUser.charAt(0).toUpperCase();

        const socket = io();
        let allRegisteredUsers = [];

        // Fetch all registered users from database server
        socket.emit('get_all_users');

        socket.on('all_users_list', (users) => {
            // Exclude current user from global directory listing
            allRegisteredUsers = (users || []).filter(u => u !== currentUser);
            renderContacts("");
        });

        const searchInput = document.getElementById('userSearchInput');
        const contactsContainer = document.getElementById('contactsContainer');

        function renderContacts(query) {
            const trimmedQuery = query.trim().toLowerCase();

            // When search input is empty, show global registered users directory
            if (trimmedQuery === "") {
                if (allRegisteredUsers.length === 0) {
                    contactsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-users"></i>
                            <span>No other registered users found on Berryweb yet.</span>
                        </div>
                    `;
                } else {
                    let html = `<div class="section-label">All Berryweb Users</div>`;
                    allRegisteredUsers.forEach(username => {
                        html += `
                            <div class="contact-card" onclick="openChatWith('${username}')">
                                <div class="contact-avatar-wrapper">
                                    <div class="contact-avatar">${username.charAt(0).toUpperCase()}</div>
                                    <div class="status-dot"></div>
                                </div>
                                <div class="contact-info">
                                    <h4>@${username}</h4>
                                    <p>Active now</p>
                                </div>
                            </div>
                        `;
                    });
                    contactsContainer.innerHTML = html;
                }
                return;
            }

            // Live global filter across all registered database users
            const matchedUsers = allRegisteredUsers.filter(name => 
                name.toLowerCase().startsWith(trimmedQuery)
            );

            if (matchedUsers.length === 0) {
                contactsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-user-slash"></i>
                        <span>No user found matching "@${query}"</span>
                    </div>
                `;
                return;
            }

            let html = `<div class="section-label">Search Results</div>`;
            matchedUsers.forEach(username => {
                html += `
                    <div class="contact-card" onclick="openChatWith('${username}')">
                        <div class="contact-avatar-wrapper">
                            <div class="contact-avatar">${username.charAt(0).toUpperCase()}</div>
                            <div class="status-dot"></div>
                        </div>
                        <div class="contact-info">
                            <h4>@${username}</h4>
                            <p>Active now</p>
                        </div>
                    </div>
                `;
            });
            contactsContainer.innerHTML = html;
        }

        // Live Search Input Listener
        searchInput.addEventListener('input', (e) => {
            renderContacts(e.target.value);
        });

        function openChatWith(username) {
            localStorage.setItem('berry_active_chat', username);
            window.location.href = '/chat';
        }

        function navigateToProfile() {
            window.location.href = '/profile';
        }

        // Settings Dropdown Menu Slide & Fade Animation Control (Fixed Layering)
        const settingsToggleBtn = document.getElementById('settingsToggleBtn');
        const settingsDropdownMenu = document.getElementById('settingsDropdownMenu');

        settingsToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsDropdownMenu.classList.toggle('active');
        });

        window.addEventListener('click', () => {
            if (settingsDropdownMenu.classList.contains('active')) {
                settingsDropdownMenu.classList.remove('active');
            }
        });

        settingsDropdownMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Logout Confirmation Modal Logic with Button Loading Animations
        const logoutModalOpenBtn = document.getElementById('logoutModalOpenBtn');
        const logoutModalOverlay = document.getElementById('logoutModalOverlay');
        const modalStayBtn = document.getElementById('modalStayBtn');
        const modalConfirmLogoutBtn = document.getElementById('modalConfirmLogoutBtn');

        logoutModalOpenBtn.addEventListener('click', () => {
            settingsDropdownMenu.classList.remove('active');
            logoutModalOverlay.classList.add('active');
        });

        modalStayBtn.addEventListener('click', () => {
            const btnSpan = modalStayBtn.querySelector('span');
            btnSpan.innerHTML = `<span class="spinner"></span>`;
            setTimeout(() => {
                logoutModalOverlay.classList.remove('active');
                btnSpan.textContent = 'No';
            }, 300);
        });

        modalConfirmLogoutBtn.addEventListener('click', () => {
            const btnSpan = modalConfirmLogoutBtn.querySelector('span');
            btnSpan.innerHTML = `<span class="spinner"></span>`;
            
            setTimeout(() => {
                localStorage.removeItem('berry_user');
                localStorage.removeItem('username');
                localStorage.removeItem('chat_user');
                localStorage.removeItem('berry_active_chat');
                window.location.href = '/login';
            }, 600);
        });

        logoutModalOverlay.addEventListener('click', (e) => {
            if (e.target === logoutModalOverlay) {
                logoutModalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
