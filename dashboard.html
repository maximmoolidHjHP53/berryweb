<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BerryWeb</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1621;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: #17212b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Profile Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: #2fa572;
            color: #0e1621;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
        }

        .user-details h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
        }

        .user-details span {
            font-size: 13px;
            color: #2fa572;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-inbox {
            background-color: #2b3b4c;
            color: #f5f5f5;
        }

        .btn-logout {
            background-color: #eb5757;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* Search Section */
        h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #8a96a3;
            letter-spacing: 0.5px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background-color: #0e1621;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #f5f5f5;
            box-sizing: border-box;
            font-size: 14px;
        }

        .search-input:focus {
            border-color: #2fa572;
            outline: none;
        }

        /* Live Search Results Dropdown */
        .search-results {
            background: #0e1621;
            border: 1px solid #374151;
            border-radius: 8px;
            margin-top: 5px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .search-result-item {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }

        .search-result-item button {
            background: #2fa572;
            color: #0e1621;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Friend List */
        .friend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }

        .no-friends {
            color: #8a96a3;
            font-size: 13px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="card profile-header">
            <div class="profile-info">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <h3 id="usernameDisplay">User</h3>
                    <span onclick="alert('Profile settings coming soon!')">View Profile</span>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-inbox" onclick="window.location.href='/inbox'">Inbox</button>
                <button class="btn btn-logout" onclick="logout()">Log Out</button>
            </div>
        </div>

        <div class="card">
            <h4>FIND USERS & ADD FRIENDS</h4>
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="@ search username...">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <div class="card">
            <h4>MY FRIENDLIST</h4>
            <ul id="friendList" class="friend-list">
                <li class="no-friends">Loading friendlist...</li>
            </ul>
        </div>
    </div>

    <script>
        // Check active login session
        const currentUsername = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUsername) {
            window.location.href = '/login';
        } else {
            document.getElementById('usernameDisplay').textContent = currentUsername;
            document.getElementById('userAvatar').textContent = currentUsername.charAt(0).toUpperCase();
        }

        // Logout function
        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        // Live User Search Functionality
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length < 1) {
                searchResults.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&user=${encodeURIComponent(currentUsername)}`);
                const users = await res.json();

                searchResults.innerHTML = '';
                if (users.length > 0) {
                    searchResults.style.display = 'block';
                    users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.innerHTML = `<span>@${user.username}</span> <button onclick="addFriend('${user.username}')">Add</button>`;
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'block';
                    searchResults.innerHTML = `<div style="padding:10px; color:#8a96a3; font-size:13px;">No users found</div>`;
                }
            } catch (err) {
                console.error("Search error", err);
            }
        });

        // Add Friend Function
        async function addFriend(friendUsername) {
            try {
                const res = await fetch('/api/add-friend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, friendUsername })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Successfully added @${friendUsername}!`);
                    searchInput.value = '';
                    searchResults.style.display = 'none';
                    loadFriends();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Error adding friend.");
            }
        }

        // Load Friendlist Function
        async function loadFriends() {
            const friendListEl = document.getElementById('friendList');
            try {
                const res = await fetch(`/api/friends?user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();

                friendListEl.innerHTML = '';
                if (data.friends && data.friends.length > 0) {
                    data.friends.forEach(friend => {
                        const li = document.createElement('li');
                        li.className = 'friend-item';
                        li.innerHTML = `<span>@${friend}</span> <span style="color:#2fa572; font-size:12px;">Connected</span>`;
                        friendListEl.appendChild(li);
                    });
                } else {
                    friendListEl.innerHTML = `<li class="no-friends">No friends added yet. Search above to connect!</li>`;
                }
            } catch (err) {
                friendListEl.innerHTML = `<li class="no-friends">Failed to load friendlist.</li>`;
            }
        }

        // Load friends on initial render
        loadFriends();
    </script>
</body>
</html>
