<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BerryWeb - Dashboard</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #00e676;
            --hover-overlay: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.06);
            --modal-bg: #181818;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-green: #00c853;
            --hover-overlay: rgba(0, 0, 0, 0.04);
            --border-color: rgba(0, 0, 0, 0.08);
            --modal-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .app-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .settings-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .settings-icon-btn:active {
            background-color: var(--hover-overlay);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            margin: 14px 16px 0 16px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .card-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .profile-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: var(--hover-overlay);
            color: var(--accent-green);
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
            border: 2px solid var(--border-color);
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--card-bg);
            background-color: #00e676;
        }

        .user-details h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .view-profile {
            font-size: 12px;
            color: var(--accent-green);
            cursor: pointer;
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-inbox {
            background-color: var(--hover-overlay);
            color: var(--text-main);
            position: relative;
            border: 1px solid var(--border-color);
        }

        .inbox-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
            display: none;
        }

        .btn:active {
            opacity: 0.7;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--hover-overlay);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: 6px;
            max-height: 180px;
            overflow-y: auto;
            display: none;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .search-result-item {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .result-username {
            font-size: 14px;
            font-weight: 600;
        }

        .add-btn {
            background-color: var(--accent-green);
            color: #0a0a0a;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .add-btn.pending {
            background-color: var(--hover-overlay);
            color: var(--text-muted);
            cursor: default;
        }

        .friend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .friend-item:active {
            background-color: var(--hover-overlay);
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .friend-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .friend-avatar {
            width: 42px;
            height: 42px;
            background-color: var(--hover-overlay);
            color: var(--accent-green);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
            border: 1px solid var(--border-color);
        }

        .friend-details {
            flex: 1;
            min-width: 0;
        }

        .friend-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .friend-name.unread {
            color: var(--text-main);
            font-weight: 800;
        }

        .friend-last-msg {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .friend-last-msg.unread {
            color: var(--accent-green);
            font-weight: 600;
        }

        .friend-meta-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            padding-left: 10px;
            flex-shrink: 0;
        }

        .unread-badge {
            background-color: #ff3b30 !important;
            color: #ffffff !important;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.4);
            display: inline-block;
        }

        .message-action {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .no-friends {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 24px 0;
        }

        /* --- MODAL STYLES WITH HOVER/OPEN TRANSITIONS --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: var(--modal-bg);
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 24px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .settings-option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background-color: var(--hover-overlay);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            transition: background-color 0.2s;
        }

        .settings-item:hover {
            background-color: rgba(255,255,255,0.07);
        }

        .settings-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-item-left span {
            font-size: 16px;
        }

        .logout-btn-item {
            color: #ff5252;
            border-color: rgba(255, 82, 82, 0.2);
            background-color: rgba(255, 82, 82, 0.05);
        }

        .logout-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .logout-action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .btn-confirm-logout {
            background-color: #ff3b30;
            color: white;
        }

        .btn-stay-on {
            background-color: var(--hover-overlay);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-text">BERRYWEB</div>
            <button class="settings-icon-btn" onclick="openSettingsModal()" title="Settings">⚙️</button>
        </header>

        <div class="card profile-card">
            <div class="profile-left">
                <div class="avatar-container">
                    <div class="avatar" id="userAvatar">U</div>
                    <div class="status-dot"></div>
                </div>
                <div class="user-details">
                    <h3 id="usernameDisplay">User</h3>
                    <div class="view-profile" onclick="openSettingsModal()">View Profile</div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-inbox" onclick="window.location.href='/inbox'">
                    Inbox
                    <span id="inboxBadge" class="inbox-badge">0</span>
                </button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Find Users</div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search username..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <div class="card" style="flex: 1; margin-bottom: 16px;">
            <div class="card-title">My Chats</div>
            <ul id="friendList" class="friend-list">
                <li class="no-friends" id="loadingText">Loading chats...</li>
            </ul>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay" onclick="handleModalBackdrop(event, 'settingsModal')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="modal-close" onclick="closeSettingsModal()">&times;</button>
            </div>
            <div class="settings-option-list">
                <div class="settings-item" onclick="alert('Profile Username: ' + currentUsername)">
                    <div class="settings-item-left"><span>👤</span> Profile</div>
                    <span style="color:var(--text-muted); font-size:12px;">View</span>
                </div>
                <div class="settings-item" onclick="toggleTheme()">
                    <div class="settings-item-left"><span>🌓</span> Theme Mode</div>
                    <span id="themeLabel" style="color:var(--accent-green); font-size:12px;">Dark / Light</span>
                </div>
                <div class="settings-item" onclick="clearLocalCache()">
                    <div class="settings-item-left"><span>🧹</span> Clear Space</div>
                    <span style="color:var(--text-muted); font-size:12px;">Reset</span>
                </div>
                <div class="settings-item" onclick="alert('BerryWeb v2.5 - Early Access Enabled')">
                    <div class="settings-item-left"><span>🚀</span> Early Access</div>
                    <span style="color:var(--accent-green); font-size:12px;">Active</span>
                </div>
                <div class="settings-item logout-btn-item" onclick="openLogoutModal()">
                    <div class="settings-item-left"><span>🚪</span> Log Out</div>
                    <span>›</span>
                </div>
            </div>
        </div>
    </div>

    <div id="logoutModal" class="modal-overlay" onclick="handleModalBackdrop(event, 'logoutModal')">
        <div class="modal-box" style="text-align: center;">
            <div style="font-size: 36px; margin-bottom: 10px;">⚠️</div>
            <div class="modal-title" style="margin-bottom: 8px;">Log Out of BerryWeb?</div>
            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Are you sure you want to end your active session on this device?</div>
            <div class="logout-actions">
                <button class="logout-action-btn btn-stay-on" onclick="closeLogoutModal()">Stay On</button>
                <button class="logout-action-btn btn-confirm-logout" onclick="executeLogout()">Log Out</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
         // --- Ironclad Registration Guard: Prevent visiting register if already logged in ---
const activeUser = localStorage.getItem('berry_session_user') || localStorage.getItem('username');
if (activeUser) {
    window.location.replace('/dashboard');
}

     
        // --- Permanent Security & Session Guard ---
        let currentUsername = localStorage.getItem('berry_session_user') || localStorage.getItem('username');
        
        if (!currentUsername) {
            window.location.replace('/login');
        } else {
            localStorage.setItem('berry_session_user', currentUsername);
            localStorage.setItem('username', currentUsername);

            history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', function () {
                history.pushState(null, null, window.location.href);
            });

            document.getElementById('usernameDisplay').textContent = currentUsername;
            document.getElementById('userAvatar').textContent = currentUsername.charAt(0).toUpperCase();
        }

        // --- Initialize Socket.io Connection ---
        const socket = io();
        socket.emit('join', currentUsername);

        // --- Theme Handler ---
        const savedTheme = localStorage.getItem('berry_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark Mode' : 'Light Mode';

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('berry_theme', newTheme);
            document.getElementById('themeLabel').textContent = newTheme === 'dark' ? 'Dark Mode' : 'Light Mode';
        }

        function clearLocalCache() {
            localStorage.removeItem('berry_search_cache');
            alert('Local space cleared successfully!');
            closeSettingsModal();
        }

        // --- Modal Transitions ---
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
        }
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }
        function openLogoutModal() {
            closeSettingsModal();
            document.getElementById('logoutModal').classList.add('active');
        }
        function closeLogoutModal() {
            document.getElementById('logoutModal').classList.remove('active');
            openSettingsModal(); // Returns back to settings box smoothly as requested
        }
        function handleModalBackdrop(event, modalId) {
            if (event.target.id === modalId) {
                document.getElementById(modalId).classList.remove('active');
            }
        }

        function executeLogout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('/login');
        }

        // --- Live Search Bar Fixed Behavior ---
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length === 0) {
                searchResults.style.display = 'none';
                searchResults.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();

                searchResults.innerHTML = '';
                if (data.users && data.users.length > 0) {
                    searchResults.style.display = 'block';
                    data.users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        
                        let btnHtml = '';
                        if (user.status === 'friends') {
                            btnHtml = `<button class="add-btn pending" disabled>Friends</button>`;
                        } else if (user.status === 'pending_sent') {
                            btnHtml = `<button class="add-btn pending" disabled>Pending</button>`;
                        } else {
                            btnHtml = `<button onclick="sendFriendRequest('${user.username}', this)" class="add-btn">Add</button>`;
                        }

                        div.innerHTML = `<span class="result-username">@${user.username}</span> ${btnHtml}`;
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'block';
                    searchResults.innerHTML = `<div style="padding:14px; color:var(--text-muted); font-size:13px; text-align:center;">No users found</div>`;
                }
            } catch (err) {
                searchResults.style.display = 'none';
            }
        });

        // Hide search dropdown cleanly when clicking anywhere outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        async function sendFriendRequest(friendUsername, btnElement) {
            try {
                const res = await fetch('/api/send-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, friendUsername })
                });
                const data = await res.json();
                if (data.success) {
                    btnElement.textContent = 'Pending';
                    btnElement.classList.add('pending');
                    btnElement.disabled = true;
                }
            } catch (err) {}
      }

      let isInitialLoaded = false;

        // --- Flicker-Free Silent Background Friend & Unread Poller ---
        async function loadFriends() {
            const friendListEl = document.getElementById('friendList');
            try {
                const [friendsRes, unreadRes] = await Promise.all([
                    fetch(`/api/friends?user=${encodeURIComponent(currentUsername)}`),
                    fetch(`/api/unread-counts?user=${encodeURIComponent(currentUsername)}`).catch(() => ({ json: () => ({ counts: {} }) }))
                ]);
                
                const data = await friendsRes.json();
                const unreadData = await unreadRes.json();
                const unreadCounts = unreadData.counts || {};

                if (data.friends && data.friends.length > 0) {
                    const loadingEl = document.getElementById('loadingText');
                    if (loadingEl) loadingEl.remove();

                    for (let i = 0; i < data.friends.length; i++) {
                        const friend = data.friends[i];
                        let lastMsgText = "Tap to start chatting";
                        let unreadCount = unreadCounts[friend.username] || 0;

                        try {
                            const msgRes = await fetch(`/api/messages?user=${encodeURIComponent(currentUsername)}&friend=${encodeURIComponent(friend.username)}`);
                            const msgData = await msgRes.json();
                            if (msgData.messages && msgData.messages.length > 0) {
                                const messages = msgData.messages;
                                const latest = messages[messages.length - 1];
                                
                                if (latest.image && !latest.text) {
                                    lastMsgText = "📷 Sent a photo";
                                } else {
                                    lastMsgText = latest.text;
                                }
                            }
                        } catch (e) {}

                        const unreadClass = unreadCount > 0 ? 'unread' : '';
                        const badgeHtml = unreadCount > 0 
                            ? `<div class="unread-badge">${unreadCount}</div>` 
                            : `<div class="message-action">Chat</div>`;

                        let existingItem = document.getElementById(`friend-row-${friend.username}`);

                        // Silently update DOM nodes without clearing list (Zero Flickering!)
                        if (existingItem) {
                            const nameEl = existingItem.querySelector('.friend-name');
                            const msgEl = existingItem.querySelector('.friend-last-msg');
                            const metaEl = existingItem.querySelector('.friend-meta-right');

                            if (nameEl) nameEl.className = `friend-name ${unreadClass}`;
                            if (msgEl) {
                                msgEl.className = `friend-last-msg ${unreadClass}`;
                                if (msgEl.textContent !== escapeHtml(lastMsgText)) {
                                    msgEl.textContent = escapeHtml(lastMsgText);
                                }
                            }
                            if (metaEl && metaEl.innerHTML !== badgeHtml) {
                                metaEl.innerHTML = badgeHtml;
                            }
                        } else {
                            existingItem = document.createElement('li');
                            existingItem.className = 'friend-item';
                            existingItem.id = `friend-row-${friend.username}`;
                            existingItem.onclick = async () => {
                                try {
                                    await fetch('/api/mark-read', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ user: currentUsername, friend: friend.username })
                                    });
                                } catch(err){}
                                window.location.href = `/chat?friend=${encodeURIComponent(friend.username)}`;
                            };

                            existingItem.innerHTML = `
                                <div class="friend-info">
                                    <div class="friend-avatar-wrapper">
                                        <div class="friend-avatar">${friend.username.charAt(0).toUpperCase()}</div>
                                        <div class="status-dot"></div>
                                    </div>
                                    <div class="friend-details">
                                        <div class="friend-name ${unreadClass}">@${friend.username}</div>
                                        <span class="friend-last-msg ${unreadClass}">${escapeHtml(lastMsgText)}</span>
                                    </div>
                                </div>
                                <div class="friend-meta-right">
                                    ${badgeHtml}
                                </div>
                            `;
                            friendListEl.appendChild(existingItem);
                        }
                    }
                    isInitialLoaded = true;
                } else if (!isInitialLoaded) {
                    friendListEl.innerHTML = `<li class="no-friends">No active chats. Search above to add friends!</li>`;
                }
            } catch (err) {}
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        async function checkInboxCount() {
            try {
                const res = await fetch(`/api/inbox-count?user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                const badge = document.getElementById('inboxBadge');
                if (data.count > 0) {
                    badge.textContent = data.count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {}
        }

        // --- Real-Time Socket Event Listeners ---
        socket.on('update_inbox', (data) => {
            loadFriends();
            checkInboxCount();
        });

        socket.on('receive_message', (data) => {
            loadFriends();
            checkInboxCount();
        });

        // Run immediately and poll silently every 3 seconds as backup
        loadFriends();
        checkInboxCount();
        setInterval(() => {
            loadFriends();
            checkInboxCount();
        }, 3000);
    </script>
</body>
</html>
