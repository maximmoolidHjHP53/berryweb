<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Berryweb - Futuristic Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #070b10;
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-glass: rgba(23, 33, 43, 0.75);
            --accent-green: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.35);
            --accent-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #8a96a3;
            --border-glass: rgba(0, 255, 136, 0.15);
            --shadow-futuristic: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* Smooth Page Transition Animation */
        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            opacity: 0;
            transform: translateY(10px);
            animation: pageEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pageEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Futuristic Glassmorphism Header */
        .header-card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-futuristic);
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-green));
            box-shadow: 0 0 12px var(--accent-green);
        }

        .user-welcome h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-welcome h2 span {
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .status-pill {
            font-size: 0.75rem;
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .status-pill::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .nav-btns { display: flex; gap: 12px; }

        .btn {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 243, 255, 0.2));
            color: white;
            border: 1px solid var(--border-glass);
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .btn:hover {
            border-color: var(--accent-green);
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(235, 87, 87, 0.15);
            border-color: rgba(235, 87, 87, 0.3);
            color: #ff6b6b;
        }

        .btn-danger:hover {
            background: #eb5757;
            color: white;
            border-color: #eb5757;
            box-shadow: 0 0 20px rgba(235, 87, 87, 0.4);
        }

        /* Futuristic Panels */
        .section-card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 20px;
            box-shadow: var(--shadow-futuristic);
        }

        .section-card h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: rgba(0, 255, 136, 0.2); border-radius: 4px; }

        .list-item {
            background: rgba(14, 22, 33, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
        }

        .list-item:hover {
            border-color: var(--accent-green);
            background: rgba(14, 22, 33, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .username-text {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 3px;
            color: #fff;
        }

        /* 5-Letter Message Preview */
        .message-preview {
            font-size: 0.82rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .friend-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        /* Unread Badge Indicator Inside Friend Box */
        .unread-badge {
            background: var(--accent-green);
            color: #000;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 10px;
            display: none;
            box-shadow: 0 0 12px var(--accent-green);
            animation: pulseGlow 1.5s infinite;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .header-card { flex-direction: column; gap: 16px; align-items: flex-start; }
            .nav-btns { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-card">
            <div class="user-welcome">
                <h2>Terminal ID: <span id="displayUsername">User</span></h2>
                <div class="status-pill">Encrypted Link Active</div>
            </div>
            <div class="nav-btns">
                <a href="/chat" class="btn"><i class="fa-solid fa-comments"></i> Neural Chat</a>
                <button onclick="logout()" class="btn btn-danger"><i class="fa-solid fa-power-off"></i> Disconnect</button>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-shield-halved"></i> Active Friend Nodes & Communications</h3>
            <div class="list-container" id="friendsList">
                <div style="color: var(--text-muted); text-align: center; padding: 16px;">Scanning active neural nodes...</div>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-network-wired"></i> Global Network Registry</h3>
            <div class="list-container" id="allUsersList">
                <div style="color: var(--text-muted); text-align: center; padding: 16px;">Querying network database...</div>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-satellite-dish"></i> Incoming Connection Requests</h3>
            <div class="list-container" id="requestsList">
                <div style="color: var(--text-muted); text-align: center; padding: 16px;">Zero incoming signals detected.</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUser) window.location.href = '/login';

        document.getElementById('displayUsername').textContent = currentUser;

        let unreadCounts = {};
        let lastMessages = {};

        function loadDashboardData() {
            socket.emit('get_user_data', currentUser);
            socket.emit('get_all_users');
        }

        socket.on('user_data_response', (data) => {
            renderFriends(data.friends || []);
            renderRequests(data.friendRequests || []);
        });

        let cachedAllUsers = [];
        socket.on('all_users_list', (users) => {
            cachedAllUsers = users;
            socket.emit('get_user_data', currentUser);
        });

        socket.on('refresh_friends_' + currentUser, loadDashboardData);
        socket.on('refresh_requests_' + currentUser, loadDashboardData);

        // Real-time message listener for indicator updates & 5-letter preview
        socket.on('receive_message', (data) => {
            const otherUser = data.sender === currentUser ? data.receiver : data.sender;
            
            if (data.receiver === currentUser) {
                unreadCounts[otherUser] = (unreadCounts[otherUser] || 0) + 1;
            }

            if (data.sender === otherUser || data.receiver === otherUser) {
                lastMessages[otherUser] = data.message.substring(0, 5);
                
                const previewEl = document.getElementById(`preview_${otherUser}`);
                if (previewEl) {
                    previewEl.textContent = lastMessages[otherUser];
                }

                const badgeEl = document.getElementById(`badge_${otherUser}`);
                if (badgeEl && unreadCounts[otherUser] > 0) {
                    badgeEl.textContent = unreadCounts[otherUser];
                    badgeEl.style.display = 'inline-block';
                }
            }
        });

        function renderFriends(friends) {
            const container = document.getElementById('friendsList');
            if (friends.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 16px;">No connected nodes. Expand your network below.</div>`;
                return;
            }

            container.innerHTML = '';
            friends.forEach(friend => {
                const count = unreadCounts[friend] || 0;
                const snippet = lastMessages[friend] || 'No msg';

                const div = document.createElement('div');
                div.className = 'list-item';
                // Clicking friend box goes directly to chat with them
                div.onclick = () => { window.location.href = `/chat?with=${friend}`; };
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${friend.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${friend}</div>
                            <div class="message-preview" id="preview_${friend}">${snippet}</div>
                        </div>
                    </div>
                    <div class="friend-actions" onclick="event.stopPropagation()">
                        <div class="unread-badge" id="badge_${friend}" style="display: ${count > 0 ? 'inline-block' : 'none'};">${count}</div>
                        <a href="/chat?with=${friend}" class="btn" style="padding: 7px 14px; font-size: 0.8rem;"><i class="fa-solid fa-terminal"></i> Chat</a>
                    </div>
                `;
                container.appendChild(div);
            });

            renderAllUsers(cachedAllUsers, friends, []);
        }

        function renderAllUsers(users, friends, requests) {
            const container = document.getElementById('allUsersList');
            const availableUsers = users.filter(u => u !== currentUser && !friends.includes(u) && !requests.includes(u));

            if (availableUsers.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 16px;">All network nodes linked.</div>`;
                return;
            }

            container.innerHTML = '';
            availableUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${user.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${user}</div>
                            <div class="message-preview">Available Node</div>
                        </div>
                    </div>
                    <div class="friend-actions">
                        <button class="btn" style="padding: 7px 14px; font-size: 0.8rem;" onclick="sendRequest('${user}')"><i class="fa-solid fa-plus"></i> Connect</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderRequests(requests) {
            const container = document.getElementById('requestsList');
            if (requests.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 16px;">Zero incoming handshakes.</div>`;
                return;
            }

            container.innerHTML = '';
            requests.forEach(requester => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${requester.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${requester}</div>
                            <div class="message-preview">Pending Handshake</div>
                        </div>
                    </div>
                    <div class="friend-actions">
                        <button class="btn" style="padding: 7px 14px; font-size: 0.8rem;" onclick="respondRequest('${requester}', 'accept')"><i class="fa-solid fa-check"></i> Accept</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function sendRequest(receiver) {
            socket.emit('send_friend_request', { sender: currentUser, receiver });
            loadDashboardData();
        }

        function respondRequest(requester, action) {
            socket.emit('respond_friend_request', { username: currentUser, requester, action });
            loadDashboardData();
        }

        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('berry_user');
            window.location.href = '/login';
        }

        loadDashboardData();
    </script>
</body>
</html>
