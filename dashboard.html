<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb Messenger - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-elevation: 0 12px 40px rgba(0, 0, 0, 0.6);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: var(--bg-primary);
        }

        .sidebar {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
            max-width: 500px;
            margin: 0 auto;
            border-right: 1px solid var(--border-glass);
            border-left: 1px solid var(--border-glass);
        }

        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(23, 33, 43, 0.95);
            backdrop-filter: blur(12px);
        }

        .user-profile-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            background: var(--bg-primary);
            border: 1px solid var(--border-glass);
            transition: var(--transition-smooth);
        }

        .user-profile-preview:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-green);
            transform: translateY(-1px);
        }

        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2fa572, #1b6343);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            box-shadow: 0 4px 12px rgba(47, 165, 114, 0.3);
        }

        .user-identity h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .user-identity span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-action-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-glass);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            position: relative;
        }

        .icon-action-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-green);
            border-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #eb5757;
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid var(--bg-secondary);
        }

        .search-section {
            padding: 16px 20px;
        }

        .search-bar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            border-radius: 14px;
            padding: 0 14px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            transition: var(--transition-smooth);
        }

        .search-bar-wrapper:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(47, 165, 114, 0.2);
        }

        .search-permanent-prefix {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-green);
            font-weight: 600;
            font-size: 0.9rem;
            padding-right: 8px;
            border-right: 1px solid var(--border-glass);
            margin-right: 10px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 11px 0;
        }

        .contacts-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 16px 16px;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 10px 12px;
            font-weight: 600;
        }

        .contact-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-bottom: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-glass);
        }

        .contact-card:hover {
            background: var(--bg-tertiary);
            border-color: rgba(47, 165, 114, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .contact-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #242f3d, #17212b);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--accent-green);
            font-size: 1.1rem;
            position: relative;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
            background-color: #95a5a6; /* Default gray for offline */
        }

        .status-dot.online {
            background-color: #27ae60 !important; /* Green when online */
        }

        .contact-info h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .contact-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .action-btn-pill {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .action-btn-pill:hover {
            background: var(--accent-green-hover);
            transform: scale(1.05);
        }

        .action-btn-pill.danger {
            background: #eb5757;
        }
        .action-btn-pill.danger:hover {
            background: #c53030;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .empty-state i {
            font-size: 2.2rem;
            color: rgba(255,255,255,0.08);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: var(--shadow-elevation);
            transform: scale(0.85);
            transition: var(--transition-smooth);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .close-modal-btn:hover {
            color: var(--text-main);
        }

        .request-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-glass);
        }

        .request-actions {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-preview" onclick="window.location.href='/profile'">
                    <div class="avatar-circle" id="userInitial">U</div>
                    <div class="user-identity">
                        <h3 id="displayUsername">Loading...</h3>
                        <span>My Account</span>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="icon-action-btn" id="requestsInboxBtn" title="Friend Requests Inbox">
                        <i class="fa-solid fa-user-plus"></i>
                        <span class="badge-count" id="requestBadge" style="display:none;">0</span>
                    </button>
                    <button class="icon-action-btn" id="logoutBtn" title="Log Out">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>

            <div class="search-section">
                <div class="search-bar-wrapper">
                    <div class="search-permanent-prefix">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 0.8rem;"></i>
                        <span>@</span>
                    </div>
                    <input type="text" id="userSearchInput" class="search-input" placeholder="Search usernames globally...">
                </div>
            </div>

            <div class="contacts-scroll-area" id="contactsContainer">
                <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <span>Loading friends list...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="requestsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Friend Request Inbox</h3>
                <button class="close-modal-btn" id="closeRequestsModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="requestsListContainer">
                <div class="empty-state"><span>No pending requests.</span></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const currentUser = localStorage.getItem('berry_user') || localStorage.getItem('username') || localStorage.getItem('chat_user');
        if (!currentUser) {
            window.location.href = '/login';
        }

        document.getElementById('displayUsername').textContent = currentUser;
        document.getElementById('userInitial').textContent = currentUser.charAt(0).toUpperCase();

        const socket = io();
        let myFriends = [];
        let pendingRequests = [];
        let allRegisteredUsers = [];

        // Fetch user data and global directory on load
        socket.emit('get_user_data', currentUser);
        socket.emit('get_all_users');

        socket.on('user_data_response', (data) => {
            myFriends = data.friends || [];
            pendingRequests = data.friendRequests || [];
            updateRequestBadge();
            renderFriendsList("");
        });

        socket.on('all_users_list', (users) => {
            allRegisteredUsers = (users || []).filter(u => u.toLowerCase() !== currentUser.toLowerCase());
        });

        // Real-time synchronization listeners
        socket.on('refresh_requests_' + currentUser, () => {
            socket.emit('get_user_data', currentUser);
        });

        socket.on('refresh_friends_' + currentUser, () => {
            socket.emit('get_user_data', currentUser);
        });

        const searchInput = document.getElementById('userSearchInput');
        const contactsContainer = document.getElementById('contactsContainer');

        // Render either Friend List or Global Search Results with Add Friend buttons
        function renderFriendsList(query) {
            const trimmedQuery = query.trim().toLowerCase();

            // Case 1: Search bar is empty -> Show ONLY user's confirmed friends list
            if (trimmedQuery === "") {
                if (myFriends.length === 0) {
                    contactsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-user-group"></i>
                            <span>No friends added yet. Search a username above to add friends!</span>
                        </div>
                    `;
                } else {
                    let html = `<div class="section-label">My Friends</div>`;
                    myFriends.forEach(friend => {
                        html += `
                            <div class="contact-card" onclick="openChatWith('${friend}')">
                                <div class="contact-left">
                                    <div class="contact-avatar">
                                        ${friend.charAt(0).toUpperCase()}
                                        <div class="status-dot online" id="status_${friend}"></div>
                                    </div>
                                    <div class="contact-info">
                                        <h4>@${friend}</h4>
                                        <p>Online</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    contactsContainer.innerHTML = html;
                }
                return;
            }

            // Case 2: User is typing in search bar -> Show global search results with Add Friend button
            const matchedUsers = allRegisteredUsers.filter(name => 
                name.toLowerCase().includes(trimmedQuery)
            );

            if (matchedUsers.length === 0) {
                contactsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-user-slash"></i>
                        <span>No user found matching "@${query}"</span>
                    </div>
                `;
                return;
              }

              let html = `<div class="section-label">Global Search Results</div>`;
            matchedUsers.forEach(username => {
                const isAlreadyFriend = myFriends.includes(username);
                const isRequested = pendingRequests.includes(username);

                html += `
                    <div class="contact-card">
                        <div class="contact-left" onclick="openChatWith('${username}')">
                            <div class="contact-avatar">
                                ${username.charAt(0).toUpperCase()}
                                <div class="status-dot"></div>
                            </div>
                            <div class="contact-info">
                                <h4>@${username}</h4>
                                <p>Berryweb User</p>
                            </div>
                        </div>
                        <div>
                            ${isAlreadyFriend ? 
                                `<span style="font-size:0.8rem; color:var(--accent-green); font-weight:600;"><i class="fa-solid fa-check"></i> Friends</span>` : 
                              isRequested ? 
                                `<span style="font-size:0.8rem; color:var(--text-muted);">Requested</span>` :
                                `<button class="action-btn-pill" onclick="sendFriendRequest('${username}')"><i class="fa-solid fa-user-plus"></i> Add Friend</button>`
                            }
                        </div>
                    </div>
                `;
            });
            contactsContainer.innerHTML = html;
        }

        searchInput.addEventListener('input', (e) => {
            renderFriendsList(e.target.value);
        });

        function sendFriendRequest(targetUser) {
            socket.emit('send_friend_request', { sender: currentUser, receiver: targetUser });
            alert(`Friend request sent to @${targetUser}!`);
        }

        function updateRequestBadge() {
            const badge = document.getElementById('requestBadge');
            if (pendingRequests.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = pendingRequests.length;
            } else {
                badge.style.display = 'none';
            }
        }

        // Friend Requests Modal Handler
        const requestsInboxBtn = document.getElementById('requestsInboxBtn');
        const requestsModal = document.getElementById('requestsModal');
        const closeRequestsModal = document.getElementById('closeRequestsModal');
        const requestsListContainer = document.getElementById('requestsListContainer');

        requestsInboxBtn.addEventListener('click', () => {
            if (pendingRequests.length === 0) {
                requestsListContainer.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><span>No pending requests.</span></div>`;
            } else {
                let html = '';
                pendingRequests.forEach(requester => {
                    html += `
                        <div class="request-item">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <div class="contact-avatar" style="width:36px; height:36px; font-size:0.9rem;">${requester.charAt(0).toUpperCase()}</div>
                                <span style="font-weight:600;">@${requester}</span>
                            </div>
                            <div class="request-actions">
                                <button class="action-btn-pill" onclick="respondRequest('${requester}', 'accept')"><i class="fa-solid fa-check"></i> Confirm</button>
                                <button class="action-btn-pill danger" onclick="respondRequest('${requester}', 'reject')"><i class="fa-solid fa-xmark"></i> Delete</button>
                            </div>
                        </div>
                    `;
                });
                requestsListContainer.innerHTML = html;
            }
            requestsModal.classList.add('active');
        });

        closeRequestsModal.addEventListener('click', () => {
            requestsModal.classList.remove('active');
        });

        function respondRequest(requester, action) {
            socket.emit('respond_friend_request', { username: currentUser, requester: requester, action: action });
            pendingRequests = pendingRequests.filter(r => r !== requester);
            updateRequestBadge();
            requestsModal.classList.remove('active');
        }

        function openChatWith(username) {
            localStorage.setItem('berry_active_chat', username);
            window.location.href = '/chat';
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/login';
        });
    </script>
</body>
</html>
