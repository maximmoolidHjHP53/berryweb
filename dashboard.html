<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 80px; /* Space for search dropdown above */
        }

        .header-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-card h2 { font-size: 1.4rem; }
        .nav-btns { display: flex; gap: 10px; align-items: center; }

        .btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--accent-green-hover); }
        .btn-danger { background: #eb5757; }
        .btn-danger:hover { background: #d33b3b; }

        .btn-muted {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: default;
        }
        .btn-muted:hover { background: var(--bg-tertiary); }

        .inbox-btn {
            position: relative;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
        }
        .inbox-btn:hover { background: var(--border-glass); }

        .inbox-badge {
            position: absolute;
            top: -6px; right: -6px;
            background: #eb5757;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }

        /* Search Section with Dropdown Positioned Above */
        .search-section {
            margin-bottom: 20px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-glass);
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .search-bar:focus { border-color: var(--accent-green); }

        /* Search Results Card positioned ABOVE search bar to prevent keyboard blocking */
        .search-results-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            z-index: 50;
            display: none;
        }

        .search-results-dropdown h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 8px;
        }

        .section-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .section-card h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .list-item {
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .list-item:hover { border-color: var(--accent-green); background: var(--bg-tertiary); }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .username-text {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .message-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .unread-badge {
            background: var(--accent-green);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: none;
            box-shadow: 0 2px 8px rgba(47, 165, 114, 0.4);
        }

        /* Modal Overlay for Inbox */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .close-modal {
            background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header-card { flex-direction: column; gap: 14px; align-items: flex-start; }
            .nav-btns { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-card">
            <h2>Welcome, <span id="displayUsername">User</span></h2>
            <div class="nav-btns">
                <button class="btn inbox-btn" onclick="toggleInboxModal()">
                    <i class="fa-solid fa-inbox"></i> Inbox
                    <span class="inbox-badge" id="inboxBadge">0</span>
                </button>
                <button onclick="logout()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search @..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="filterList()">
            
            <div class="search-results-dropdown" id="searchResultCard">
                <h3><i class="fa-solid fa-magnifying-glass"></i> Search Results</h3>
                <div class="list-container" id="searchResultList"></div>
            </div>
        </div>

        <div class="section-card">
            <h3><i class="fa-solid fa-user-group"></i> My Friends</h3>
            <div class="list-container" id="friendsList">
                <div style="color: var(--text-muted); text-align: center; padding: 10px;">Loading friends...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="inboxModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-inbox"></i> Friend Requests Inbox</h3>
                <button class="close-modal" onclick="toggleInboxModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="list-container" id="requestsList" style="max-height: 250px;">
                <div style="color: var(--text-muted); text-align: center; padding: 10px;">No pending requests.</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Prevent phone back button from returning to login page
        history.pushState(null, null, window.location.href);
        window.onpopstate = function () {
            history.pushState(null, null, window.location.href);
        };

        const socket = io();
        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUser) window.location.href = '/login';

        document.getElementById('displayUsername').textContent = currentUser;

        let unreadCounts = {};
        let lastMessages = {};
        let cachedFriends = [];
        let cachedAllUsers = [];
        let cachedRequests = [];
        let sentRequests = [];

        function loadDashboardData() {
            socket.emit('get_user_data', currentUser);
            socket.emit('get_all_users');
        }

        socket.on('user_data_response', (data) => {
            cachedFriends = data.friends || [];
            cachedRequests = data.friendRequests || [];
            renderFriends(cachedFriends);
            renderRequests(cachedRequests);
            updateInboxBadge(cachedRequests.length);
            filterList();
        });

        socket.on('all_users_list', (users) => {
            cachedAllUsers = users;
            filterList();
        });

        socket.on('refresh_friends_' + currentUser, loadDashboardData);
        socket.on('refresh_requests_' + currentUser, loadDashboardData);

        socket.on('receive_message', (data) => {
            const otherUser = data.sender === currentUser ? data.receiver : data.sender;
            
            if (data.receiver === currentUser) {
                unreadCounts[otherUser] = (unreadCounts[otherUser] || 0) + 1;
            }

            if (data.sender === otherUser || data.receiver === otherUser) {
                lastMessages[otherUser] = data.message.substring(0, 5);
                
                const previewEl = document.getElementById(`preview_${otherUser}`);
                if (previewEl) {
                    previewEl.textContent = lastMessages[otherUser];
                }

                const badgeEl = document.getElementById(`badge_${otherUser}`);
                if (badgeEl && unreadCounts[otherUser] > 0) {
                    badgeEl.textContent = unreadCounts[otherUser];
                    badgeEl.style.display = 'inline-block';
                }
            }
        });

        function renderFriends(friends) {
            const container = document.getElementById('friendsList');
            if (friends.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">No friends added yet.</div>`;
                return;
            }

            container.innerHTML = '';
            friends.forEach(friend => {
                const count = unreadCounts[friend] || 0;
                const snippet = lastMessages[friend] || 'Tap to chat';

                const div = document.createElement('div');
                div.className = 'list-item';
                div.onclick = () => { window.location.href = `/chat?with=${friend}`; };
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${friend.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${friend}</div>
                            <div class="message-preview" id="preview_${friend}">${snippet}</div>
                        </div>
                    </div>
                    <div class="friend-actions" onclick="event.stopPropagation()">
                        <div class="unread-badge" id="badge_${friend}" style="display: ${count > 0 ? 'inline-block' : 'none'};">${count}</div>
                        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="window.location.href='/chat?with=${friend}'"><i class="fa-solid fa-comment"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterList() {
            let query = document.getElementById('searchInput').value.trim();
            const searchCard = document.getElementById('searchResultCard');
            const searchList = document.getElementById('searchResultList');

            if (query.startsWith('@')) {
                query = query.substring(1);
            }
            query = query.toLowerCase().trim();

            if (!query) {
                searchCard.style.display = 'none';
                return;
            }

            searchCard.style.display = 'block';
            
            const results = cachedAllUsers.filter(u => u !== currentUser && u.toLowerCase().includes(query));

            if (results.length === 0) {
                searchList.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">No users found.</div>`;
                return;
            }

            searchList.innerHTML = '';
            results.forEach(user => {
                const isFriend = cachedFriends.includes(user);
                const isPending = cachedRequests.includes(user) || sentRequests.includes(user);

                let actionHtml = '';
                if (isFriend) {
                    actionHtml = `<button class="btn btn-muted" style="padding: 6px 12px; font-size: 0.8rem;">Friends</button>`;
                } else if (isPending) {
                    actionHtml = `<button class="btn btn-muted" style="padding: 6px 12px; font-size: 0.8rem;">Pending</button>`;
                } else {
                    actionHtml = `<button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="sendRequest('${user}')"><i class="fa-solid fa-user-plus"></i> Add</button>`;
                }

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${user.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${user}</div>
                        </div>
                    </div>
                    <div class="friend-actions">
                        ${actionHtml}
                    </div>
                `;
                searchList.appendChild(div);
            });
        }
        function renderRequests(requests) {
            const container = document.getElementById('requestsList');
            if (requests.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 10px;">No pending requests.</div>`;
                return;
            }

            container.innerHTML = '';
            requests.forEach(requester => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="user-meta">
                        <div class="avatar">${requester.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <div class="username-text">${requester}</div>
                        </div>
                    </div>
                    <div class="friend-actions" style="gap: 6px;">
                        <button class="btn" style="padding: 6px 10px; font-size: 0.75rem;" onclick="respondRequest('${requester}', 'accept')">Confirm</button>
                        <button class="btn btn-danger" style="padding: 6px 10px; font-size: 0.75rem;" onclick="respondRequest('${requester}', 'decline')">Decline</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateInboxBadge(count) {
            const badge = document.getElementById('inboxBadge');
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function toggleInboxModal() {
            const modal = document.getElementById('inboxModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendRequest(receiver) {
            sentRequests.push(receiver);
            socket.emit('send_friend_request', { sender: currentUser, receiver });
            loadDashboardData();
        }

        function respondRequest(requester, action) {
            socket.emit('respond_friend_request', { username: currentUser, requester, action });
            loadDashboardData();
        }

        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('berry_user');
            window.location.href = '/login';
        }

        loadDashboardData();
    </script>
</body>
</html>
