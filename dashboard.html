<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f1117; color: #ffffff; padding: 20px;
            animation: fadeInPage 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0;
        }
        @keyframes fadeInPage { to { opacity: 1; } }

        a, button, .friend-item, .action-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        a:hover, button:hover { transform: translateY(-2px); }

        .dashboard-container { max-width: 650px; margin: 0 auto; }

        .user-header-card {
            background: #1e222d; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px; border-radius: 16px; display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .user-info-left { display: flex; align-items: center; gap: 15px; }

        .avatar-container {
            width: 55px; height: 55px; border-radius: 50%; background: #22c55e;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            font-size: 22px; overflow: hidden; color: #fff; position: relative;
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        .user-details h2 { font-size: 19px; margin-bottom: 3px; }
        .user-details a { font-size: 13px; color: #22c55e; text-decoration: none; font-weight: 500; }
        .user-details a:hover { text-decoration: underline; }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        .action-btn {
            background: #2b3140; color: white; border: none; padding: 9px 15px;
            border-radius: 10px; font-size: 13px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px; font-weight: 600;
        }
        .action-btn.logout-btn { background: #ef4444; }

        .friends-card {
            background: #1e222d; border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .friends-card h3 { font-size: 15px; margin-bottom: 15px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .friend-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; background: #252a37; border-radius: 12px; margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .friend-info { display: flex; align-items: center; gap: 12px; }

        .status-indicator { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2px solid #252a37; }
        .status-online { background-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.7); }
        .status-offline { background-color: #64748b; }

        /* Friend Chat Button with Corner Unread Badge */
        .chat-btn-wrapper { position: relative; display: inline-block; }
        .chat-icon-btn {
            background: #22c55e; color: white; border: none; padding: 7px 14px;
            border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none;
            display: inline-block;
        }
        .chat-icon-btn:hover { background: #16a34a; }

        .friend-unread-badge {
            background-color: #ef4444; color: white; font-size: 10px; font-weight: bold;
            padding: 2px 6px; border-radius: 10px; position: absolute; top: -8px; right: -8px;
            box-shadow: 0 2px 5px rgba(239, 68, 68, 0.5);
        }

        /* Logout Confirmation Modal Animation */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #1e222d; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 28px; border-radius: 18px; width: 90%; max-width: 380px;
            text-align: center; transform: scale(0.75); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .modal-backdrop.active .modal-content { transform: scale(1); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="user-header-card">
            <div class="user-info-left">
                <div class="avatar-container" id="headerAvatarContainer">
                    <span id="headerInitial">U</span>
                </div>
                <div class="user-details">
                    <h2 id="displayUsername">User</h2>
                    <a href="/profile">View Profile</a>
                </div>
            </div>
            <div class="header-actions">
                <a href="/chat" class="action-btn">Inbox</a>
                <button class="action-btn logout-btn" id="logoutBtn">Log Out</button>
            </div>
        </div>

        <div class="friends-card">
            <h3>My Friends</h3>
            <div id="friendsListContainer">
                <p style="color: #64748b; font-size: 14px;">Loading friends...</p>
            </div>
        </div>
    </div>

    <div id="logoutModal" class="modal-backdrop">
        <div class="modal-content">
            <h3 style="font-size: 20px; margin-bottom: 8px; color: #fff;">Sign Out</h3>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Are you sure you want to log out of Berryweb?</p>
            <div style="display: flex; gap: 12px;">
                <button id="cancelLogout" style="flex: 1; padding: 11px; background: #334155; border: none; color: white; border-radius: 10px; font-weight: 600; cursor: pointer;">No, Stay</button>
                <button id="confirmLogout" style="flex: 1; padding: 11px; background: #ef4444; border: none; color: white; border-radius: 10px; font-weight: 600; cursor: pointer;">Yes, Log Out</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUser) {
            window.location.href = '/login';
        } else {
            document.getElementById('displayUsername').textContent = currentUser;
            document.getElementById('headerInitial').textContent = currentUser.charAt(0).toUpperCase();
        }

        const socket = io();
        let onlineUsersList = [];
        let unreadDataMap = {};

        socket.emit('user_online', currentUser);
        socket.emit('get_user_data', currentUser);

        socket.on('user_data_response', (userData) => {
            if (userData.avatar) {
                document.getElementById('headerAvatarContainer').innerHTML = `<img src="${userData.avatar}" alt="Avatar">`;
            }
            if (userData.unreadCounts) {
                unreadDataMap = userData.unreadCounts;
            }
            renderFriends(userData.friends || []);
        });

        socket.on('update_online_status', (onlineArr) => {
            onlineUsersList = onlineArr;
            socket.emit('get_user_data', currentUser);
        });

        socket.on('update_unread_' + currentUser, (unreadCounts) => {
            unreadDataMap = unreadCounts || {};
            socket.emit('get_user_data', currentUser);
        });

        function renderFriends(friends) {
            const container = document.getElementById('friendsListContainer');
            if (friends.length === 0) {
                container.innerHTML = `<p style="color: #64748b; font-size: 14px;">No friends added yet.</p>`;
                return;
            }

            container.innerHTML = '';
            friends.forEach(friend => {
                const isOnline = onlineUsersList.includes(friend);
                const statusClass = isOnline ? 'status-online' : 'status-offline';
                const unreadCount = unreadDataMap[friend] || 0;

                const item = document.createElement('div');
                item.className = 'friend-item';
                item.innerHTML = `
                    <div class="friend-info">
                        <div style="position: relative;">
                            <div class="avatar-container" style="width: 40px; height: 40px; font-size: 16px;">${friend.charAt(0).toUpperCase()}</div>
                            <span class="status-indicator ${statusClass}" style="position: absolute; bottom: 0; right: 0;"></span>
                        </div>
                        <div>
                            <h4 style="font-size: 14px; font-weight: 600;">${friend}</h4>
                            <span style="font-size: 11px; color: #94a3b8;">${isOnline ? 'Online' : 'Offline'}</span>
                        </div>
                    </div>
                    <div class="chat-btn-wrapper">
                        <a href="/chat?to=${friend}" class="chat-icon-btn">Chat</a>
                        ${unreadCount > 0 ? `<span class="friend-unread-badge">${unreadCount}</span>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Logout Modal Confirmation Triggers
        const logoutBtn = document.getElementById('logoutBtn');
        const logoutModal = document.getElementById('logoutModal');

        logoutBtn.addEventListener('click', () => {
            logoutModal.classList.add('active');
        });

        document.getElementById('cancelLogout').addEventListener('click', () => {
            logoutModal.classList.remove('active');
        });

        document.getElementById('confirmLogout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/login';
        });
    </script>
</body>
</html>
