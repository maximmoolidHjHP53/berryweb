<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Berryweb - Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-box-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-primary);
            border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            height: 100%;
        }

        .chat-header {
            padding: 14px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .chat-username {
            font-size: 1rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.sent {
            background: var(--accent-green);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: var(--bg-secondary);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-glass);
        }

        .chat-input-area {
            padding: 14px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--accent-green-hover); }
    </style>
</head>
<body>

    <div class="chat-box-wrapper">
        <div class="chat-header">
            <a href="/dashboard" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <div class="chat-avatar" id="activeAvatar">?</div>
            <div class="chat-username" id="activeChatUser">Loading...</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Loading conversation...</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUser) window.location.href = '/login';

        const urlParams = new URLSearchParams(window.location.search);
        const activeReceiver = urlParams.get('with');

        if (!activeReceiver) {
            window.location.href = '/dashboard';
        }

        document.getElementById('activeChatUser').textContent = activeReceiver;
        document.getElementById('activeAvatar').textContent = activeReceiver.charAt(0).toUpperCase();

        socket.emit('get_messages', { user1: currentUser, user2: activeReceiver });

        socket.on('loaded_messages', (messages) => {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            if (messages.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Say hello to ${activeReceiver}!</div>`;
                return;
            }
            messages.forEach(msg => appendMessage(msg));
        });

        socket.on('receive_message', (data) => {
            if ((data.sender === activeReceiver && data.receiver === currentUser) ||
                (data.sender === currentUser && data.receiver === activeReceiver)) {
                
                const container = document.getElementById('chatMessages');
                if (container.children.length === 1 && container.children[0].tagName === 'DIV' && container.children[0].style.color) {
                    container.innerHTML = '';
                }
                appendMessage(data);
            }
        });

        function appendMessage(data) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${data.sender === currentUser ? 'sent' : 'received'}`;
            div.textContent = data.message;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('messageInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const msgData = {
                sender: currentUser,
                receiver: activeReceiver,
                message: text,
                timestamp: new Date()
            };

            socket.emit('send_message', msgData);
            input.value = '';
        }
    </script>
</body>
</html>
