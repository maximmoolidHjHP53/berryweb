<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb Secure Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --msg-out: #2b5278;
            --msg-in: #182533;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
        }

        .chat-header {
            padding: 12px 20px;
            background: rgba(23, 33, 43, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .back-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .back-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-green);
            border-color: var(--accent-green);
            transform: translateX(-2px);
        }

        .chat-user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #242f3d, #17212b);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--accent-green);
            font-size: 1.1rem;
            position: relative;
        }

        .chat-user-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .chat-user-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: radial-gradient(circle at center, #101923 0%, #0e1621 100%);
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.incoming {
            background: var(--msg-in);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-glass);
        }

        .message-bubble.outgoing {
            background: var(--msg-out);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 4px;
        }

        .chat-input-footer {
            padding: 16px 20px;
            background: rgba(23, 33, 43, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .chat-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(47, 165, 114, 0.2);
        }

        .send-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition-smooth);
        }

        .send-btn:hover {
            background: var(--accent-green-hover);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <button class="back-btn" onclick="window.location.href='/dashboard'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="chat-user-avatar">
                <span id="headerInitial">U</span>
                <div class="status-dot online"></div>
            </div>
            <div class="chat-user-info">
                <h3 id="headerChatUser">Chat</h3>
                <p id="typingIndicator">Online</p>
            </div>
        </div>

        <div class="messages-area" id="messagesContainer">
            </div>

        <div class="chat-input-footer">
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a secure message...">
            <button class="send-btn" id="sendMessageBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const currentUser = localStorage.getItem('berry_user') || localStorage.getItem('username') || localStorage.getItem('chat_user');
        const activeChatUser = localStorage.getItem('berry_active_chat');

        if (!currentUser || !activeChatUser) {
            window.location.href = '/dashboard';
        }

        document.getElementById('headerChatUser').textContent = '@' + activeChatUser;
        document.getElementById('headerInitial').textContent = activeChatUser.charAt(0).toUpperCase();

        const socket = io();
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');
        const typingIndicator = document.getElementById('typingIndicator');

        // Fetch past conversation history
        socket.emit('get_messages', { user1: currentUser, user2: activeChatUser });

        socket.on('loaded_messages', (msgs) => {
            messagesContainer.innerHTML = '';
            msgs.forEach(msg => appendMessage(msg));
            scrollToBottom();
        });

        socket.on('receive_message', (msg) => {
            if ((msg.sender === currentUser && msg.receiver === activeChatUser) ||
                (msg.sender === activeChatUser && msg.receiver === currentUser)) {
                appendMessage(msg);
                scrollToBottom();
            }
        });

        // Typing indicator logic
        let typingTimeout;
        messageInput.addEventListener('input', () => {
            socket.emit('typing', { sender: currentUser, receiver: activeChatUser });
        });

        socket.on('display_typing', (data) => {
            if (data.sender === activeChatUser && data.receiver === currentUser) {
                typingIndicator.textContent = 'typing...';
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingIndicator.textContent = 'Online';
                }, 1200);
            }
        });

        document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const msgData = {
                sender: currentUser,
                receiver: activeChatUser,
                message: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            socket.emit('send_message', msgData);
            messageInput.value = '';
        }

        function appendMessage(msg) {
            const isOutgoing = msg.sender === currentUser;
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
            bubble.innerHTML = `
                <div>${escapeHtml(msg.message)}</div>
                <div class="message-time">${msg.timestamp || ''}</div>
            `;
            messagesContainer.appendChild(bubble);
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
