<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BerryWeb - Chat</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #00e676;
            --sent-bubble: #004d26;
            --recv-bubble: #1f1f1f;
            --border-color: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-color);
        }

        .chat-header {
            background-color: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .back-btn {
            color: var(--accent-green);
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            background-color: #1e1e1e;
            color: var(--accent-green);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .chat-title-wrapper span {
            display: block;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .chat-status {
            font-size: 11px;
            color: var(--accent-green);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-color);
            min-height: 0;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            word-break: break-word;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .message.sent {
            background-color: var(--sent-bubble);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .message.received {
            background-color: var(--recv-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin-top: 4px;
            cursor: pointer;
        }

        /* Footer Input Bar */
        .chat-input-bar {
            background-color: var(--card-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            width: 100%;
        }

        .attach-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .attach-btn:active {
            transform: scale(0.9);
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background-color: var(--accent-green);
            color: #0a0a0a;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .send-btn:active {
            opacity: 0.8;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <a href="/dashboard" class="back-btn">&larr;</a>
            <div class="chat-avatar" id="chatAvatar">?</div>
            <div class="chat-title-wrapper">
                <span class="chat-title" id="chatTitle">Chat</span>
                <span class="chat-status">Online</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <form class="chat-input-bar" id="chatForm">
            <input type="file" id="fileInput" accept="image/*">
            <button type="button" class="attach-btn" id="attachBtn" title="Send Photo">🖇️</button>
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="random_chat_field_xyz" readonly onfocus="this.removeAttribute('readonly');">
            <button type="submit" class="send-btn">&#10148;</button>
        </form>
    </div>

    <script>
        const currentUsername = localStorage.getItem('username') || localStorage.getItem('berry_user');
        const urlParams = new URLSearchParams(window.location.search);
        const friendUsername = urlParams.get('friend');

        if (!currentUsername || !friendUsername) {
            window.location.href = '/dashboard';
        }

        document.getElementById('chatTitle').textContent = `@${friendUsername}`;
        document.getElementById('chatAvatar').textContent = friendUsername.charAt(0).toUpperCase();

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        const chatMessages = document.getElementById('chatMessages');
        const fileInput = document.getElementById('fileInput');
        const attachBtn = document.getElementById('attachBtn');

        attachBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Instant Photo Compression & Upload Handler (Fixes multi-try failure lag)
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (uploadEvent) {
                const img = new Image();
                img.onload = async function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800; // Optimal max width for fast transmission

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Convert compressed image to lightweight JPEG Base64 string
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

                    await sendDataToServer({
                        sender: currentUsername,
                        receiver: friendUsername,
                        text: '',
                        image: compressedBase64
                    });
                };
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            await sendDataToServer({
                sender: currentUsername,
                receiver: friendUsername,
                text: text,
                image: ''
            });
        });

        async function sendDataToServer(payload) {
            try {
                const res = await fetch('/api/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    await loadMessages();
                    scrollToBottom(); // Instant scroll down like Facebook
                }
            } catch (err) {}
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        let lastMessageCount = 0;
        let isInitialLoad = true;

        async function loadMessages() {
            try {
                const res = await fetch(`/api/messages?user=${encodeURIComponent(currentUsername)}&friend=${encodeURIComponent(friendUsername)}`);
                const data = await res.json();
                
                if (data.messages) {
                    if (data.messages.length > lastMessageCount && lastMessageCount > 0) {
                        const latest = data.messages[data.messages.length - 1];
                        if (latest.sender === friendUsername) {
                            if ("Notification" in window && Notification.permission === "granted") {
                                new Notification(`New message from @${friendUsername}`, {
                                    body: latest.text || "Sent a photo 🖇️",
                                    icon: "/favicon.ico"
                                });
                            }
                        }
                    }
                    
                    const needsScroll = data.messages.length !== lastMessageCount;
                    lastMessageCount = data.messages.length;

                    chatMessages.innerHTML = '';
                    data.messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = `message ${msg.sender === currentUsername ? 'sent' : 'received'}`;
                        
                        let contentHtml = '';
                        if (msg.text) {
                            contentHtml += `<div>${escapeHtml(msg.text)}</div>`;
                        }
                        if (msg.image) {
                            contentHtml += `<img src="${msg.image}" alt="Attachment" onclick="window.open(this.src)" />`;
                        }
                        
                        div.innerHTML = contentHtml;
                        chatMessages.appendChild(div);
                    });

                    if (isInitialLoad || needsScroll) {
                        scrollToBottom();
                        isInitialLoad = false;
                    }
                }
            } catch (err) {}
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
