<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BerryWeb - Chat</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #00e676;
            --hover-overlay: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.06);
            --bubble-me: #00e676;
            --bubble-me-text: #0a0a0a;
            --bubble-other: #202020;
            --bubble-other-text: #e0e0e0;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-green: #00c853;
            --hover-overlay: rgba(0, 0, 0, 0.04);
            --border-color: rgba(0, 0, 0, 0.08);
            --bubble-me: #00c853;
            --bubble-me-text: #ffffff;
            --bubble-other: #e9ecef;
            --bubble-other-text: #111111;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .chat-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .chat-header {
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .header-avatar {
            width: 38px;
            height: 38px;
            background-color: var(--hover-overlay);
            color: var(--accent-green);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
            border: 1px solid var(--border-color);
        }

        .header-info h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
        }

        .header-status {
            font-size: 11px;
            color: var(--accent-green);
            margin-top: 2px;
        }

        .messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-color);
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.me {
            background-color: var(--bubble-me);
            color: var(--bubble-me-text);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.other {
            background-color: var(--bubble-other);
            color: var(--bubble-other-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-image {
            max-width: 220px;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            margin-bottom: 4px;
        }

        .message-meta {
            font-size: 10px;
            margin-top: 4px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            opacity: 0.8;
        }

        .typing-indicator-row {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--accent-green);
            background-color: var(--card-bg);
            font-style: italic;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 35px;
        }
        
        .typing-dots {
            display: inline-flex;
            gap: 3px;
            align-items: center;
        }

        .typing-dots span {
            height: 5px;
            width: 5px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: -1.1s; }
        .typing-dots span:nth-child(3) { animation-delay: -0.9s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .chat-input-bar {
            height: 65px;
            padding: 0 16px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .file-upload-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--hover-overlay);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            background-color: var(--accent-green);
            color: #0a0a0a;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
            transition: transform 0.1s ease;
        }
        .send-btn:active {
            transform: scale(0.92);
        }

        .photo-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .photo-modal.active {
            display: flex;
        }
        .photo-modal img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 12px;
            object-fit: contain;
        }
        .photo-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        .modal-action-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        .btn-download {
            background-color: var(--accent-green);
            color: #0a0a0a;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-close-modal {
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='/dashboard'">←</button>
                <div class="header-avatar" id="headerAvatar">?</div>
                <div class="header-info">
                    <h3 id="headerUsername">Chat</h3>
                    <div class="header-status">Online</div>
                </div>
            </div>
        </header>

        <div class="messages-area" id="messagesArea"></div>

        <div class="typing-indicator-row" id="typingIndicator">
            <span id="typingUser">Friend</span> is typing
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>

        <div class="chat-input-bar">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button class="file-upload-btn" onclick="document.getElementById('imageInput').click()" title="Send Photo">📎</button>
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." oninput="handleTypingInput()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div id="photoModal" class="photo-modal" onclick="closePhotoModal(event)">
        <img id="modalImage" src="" alt="Enlarged Photo">
        <div class="photo-actions">
            <a id="downloadLink" class="modal-action-btn btn-download" download="berryweb_photo.jpg">Download to Phone</a>
            <button class="modal-action-btn btn-close-modal" onclick="document.getElementById('photoModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Apply theme immediately from localStorage
        const savedTheme = localStorage.getItem('berry_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const urlParams = new URLSearchParams(window.location.search);
        let friendUsername = urlParams.get('friend');
        const currentUsername = localStorage.getItem('berry_session_user') || localStorage.getItem('username');

        if (!currentUsername || !friendUsername) {
            window.location.replace('/dashboard');
        }

        document.getElementById('headerUsername').textContent = `@${friendUsername}`;
        document.getElementById('headerAvatar').textContent = friendUsername.charAt(0).toUpperCase();

        const socket = io();
        socket.emit('join', currentUsername);

        const renderedMessageKeys = new Set();

        async function loadMessages() {
            try {
                const res = await fetch(`/api/messages?user=${encodeURIComponent(currentUsername)}&friend=${encodeURIComponent(friendUsername)}`);
                const data = await res.json();
                const area = document.getElementById('messagesArea');

                if (data.messages) {
                    // Only redraw if message count changes to prevent blinking/re-rendering lag
                    if (data.messages.length !== renderedMessageKeys.size) {
                        area.innerHTML = '';
                        renderedMessageKeys.clear();
                        data.messages.forEach(msg => {
                            renderMessage(msg, false); // false = don't force auto-scroll every single item on initial load
                        });
                        area.scrollTop = area.scrollHeight;
                    }
                }
            } catch (err) {}
        }

        function renderMessage(msg, shouldScroll = true) {
            const msgKey = `${msg.sender}_${msg.time}_${msg.text || msg.image}`;
            if (renderedMessageKeys.has(msgKey)) return;
            renderedMessageKeys.add(msgKey);

            const area = document.getElementById('messagesArea');
            const isMe = msg.sender === currentUsername;
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isMe ? 'me' : 'other'}`;

            let contentHtml = '';
            if (msg.image) {
                contentHtml += `<img src="${msg.image}" class="message-image" onclick="openPhotoModal('${msg.image}')">`;
            }
            if (msg.text) {
                contentHtml += `<div>${escapeHtml(msg.text)}</div>`;
            }

            let statusIndicator = isMe ? (msg.read ? '<span>✓✓ Seen</span>' : '<span>✓ Sent</span>') : '';

            bubble.innerHTML = `
                ${contentHtml}
                <div class="message-meta">
                    <span>${msg.time || ''}</span>
                    ${statusIndicator}
                </div>
            `;
            area.appendChild(bubble);
            
            if (shouldScroll) {
                area.scrollTop = area.scrollHeight;
            }
        }

        function handleTypingInput() {
            const inputVal = document.getElementById('messageInput').value;
            const isTyping = inputVal.trim().length > 0;
            socket.emit('typing', { sender: currentUsername, receiver: friendUsername, typing: isTyping });
        }

        socket.on('display_typing', (data) => {
            const indicator = document.getElementById('typingIndicator');
            const userSpan = document.getElementById('typingUser');

            if (data.sender === friendUsername) {
                if (data.typing) {
                    userSpan.textContent = `@${friendUsername}`;
                    indicator.style.setProperty('display', 'flex', 'important');
                } else {
                    indicator.style.setProperty('display', 'none', 'important');
                }
            }
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            input.value = '';
            socket.emit('typing', { sender: currentUsername, receiver: friendUsername, typing: false });

            const messagePayload = {
                sender: currentUsername,
                receiver: friendUsername,
                text: text,
                image: '',
                time: timeStr
            };

            // Instant Messenger style rendering
            renderMessage(messagePayload, true);
            socket.emit('send_message', messagePayload);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const messagePayload = {
                    sender: currentUsername,
                    receiver: friendUsername,
                    text: '',
                    image: uploadEvent.target.result,
                    time: timeStr
                };

                renderMessage(messagePayload, true);
                socket.emit('send_message', messagePayload);
            };
            reader.readAsDataURL(file);
        }

        socket.on('receive_message', (data) => {
            if (data.sender === friendUsername || data.receiver === friendUsername) {
                renderMessage(data, true);
            }
        });

        function openPhotoModal(imgSrc) {
            const modal = document.getElementById('photoModal');
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('downloadLink').href = imgSrc;
            modal.classList.add('active');
        }

        function closePhotoModal(e) {
            if (e.target.id === 'photoModal') {
                document.getElementById('photoModal').classList.remove('active');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        loadMessages();
        // Background sync check every 4 seconds without resetting scroll position
        setInterval(loadMessages, 4000);
    </script>
</body>
</html>
