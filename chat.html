<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BerryWeb - Chat</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #00e676;
            --hover-overlay: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.06);
            --modal-bg: #181818;
            --chat-bubble-me: #00e676;
            --chat-bubble-me-text: #0a0a0a;
            --chat-bubble-friend: #1f1f1f;
            --chat-bubble-friend-text: #e0e0e0;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-green: #00c853;
            --hover-overlay: rgba(0, 0, 0, 0.04);
            --border-color: rgba(0, 0, 0, 0.08);
            --modal-bg: #ffffff;
            --chat-bubble-me: #00c853;
            --chat-bubble-me-text: #ffffff;
            --chat-bubble-friend: #eaeaea;
            --chat-bubble-friend-text: #111111;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            background-color: var(--bg-color);
        }

        .chat-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        .friend-meta h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
        }

        .friend-status {
            font-size: 11px;
            color: var(--accent-green);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            word-break: break-word;
            position: relative;
            box-sizing: border-box;
        }

        .message-bubble.me {
            background-color: var(--chat-bubble-me);
            color: var(--chat-bubble-me-text);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .message-bubble.friend {
            background-color: var(--chat-bubble-friend);
            color: var(--chat-bubble-friend-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 9px;
            margin-top: 4px;
            text-align: right;
            opacity: 0.7;
        }

        .chat-input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            padding: 12px 16px;
            box-sizing: border-box;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--hover-overlay);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .send-btn {
            background-color: var(--accent-green);
            color: #0a0a0a;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" onclick="window.location.href='/dashboard'">←</button>
                <div class="friend-meta">
                    <h3 id="chatTitle">Chat</h3>
                    <div class="friend-status" id="typingStatus">Online</div>
                </div>
            </div>
        </header>

        <div class="chat-messages" id="chatMessages">
            <div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">Loading messages...</div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" id="sendBtn">➔</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const friendUsername = urlParams.get('friend');
        const currentUsername = localStorage.getItem('berry_session_user') || localStorage.getItem('username');

        if (!currentUsername || !friendUsername) {
            window.location.replace('/dashboard');
        }

        document.getElementById('chatTitle').textContent = `@${friendUsername}`;

        const socket = io();
        socket.emit('join', currentUsername);

        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingStatus = document.getElementById('typingStatus');

        async function loadMessages() {
            try {
                const res = await fetch(`/api/messages?user=${encodeURIComponent(currentUsername)}&friend=${encodeURIComponent(friendUsername)}`);
                const data = await res.json();
                
                messagesContainer.innerHTML = '';
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        appendMessage(msg);
                    });
                    scrollToBottom();
                } else {
                    messagesContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">No messages yet. Say hello!</div>`;
                }
            } catch (err) {}
        }

        function appendMessage(msg) {
            const isMe = msg.sender === currentUsername;
            const div = document.createElement('div');
            div.className = `message-bubble ${isMe ? 'me' : 'friend'}`;
            
            div.innerHTML = `
                <div>${escapeHtml(msg.text)}</div>
                <div class="message-time">${msg.time || ''}</div>
            `;
            messagesContainer.appendChild(div);
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgData = {
                sender: currentUsername,
                receiver: friendUsername,
                text: text,
                image: '',
                time: timeStr
            };

            socket.emit('send_message', msgData);
            appendMessage(msgData);
            scrollToBottom();

            messageInput.value = '';
            
            // Remove 'No messages yet' placeholder if present
            const placeholder = messagesContainer.querySelector('div[style*="text-align:center"]');
            if (placeholder) placeholder.remove();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('receive_message', (data) => {
            if (data.sender === friendUsername) {
                appendMessage(data);
                scrollToBottom();
            }
        });

        // Typing indicator listener
        messageInput.addEventListener('input', () => {
            socket.emit('typing', { sender: currentUsername, receiver: friendUsername, typing: true });
        });

        socket.on('display_typing', (data) => {
            if (data.sender === friendUsername) {
                typingStatus.textContent = data.typing ? 'Typing...' : 'Online';
                setTimeout(() => { typingStatus.textContent = 'Online'; }, 2000);
            }
        });

        loadMessages();
    </script>
</body>
</html>
