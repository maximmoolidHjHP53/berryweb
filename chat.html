<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - BerryWeb</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1621;
            color: #f5f5f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background-color: #17212b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .back-btn {
            color: #2fa572;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            background-color: #242f3d;
            color: #2fa572;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
            font-size: 14px;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            word-break: break-word;
            line-height: 1.4;
        }

        .message.sent {
            background-color: #2b5278; /* Telegram blue-accented sent bubble */
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            background-color: #182533; /* Telegram dark-grey received bubble */
            color: #f5f5f5;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-bar {
            background-color: #17212b;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            background-color: #0e1621;
            border: 1px solid #242f3d;
            border-radius: 8px;
            color: #f5f5f5;
            outline: none;
            font-size: 14px;
        }

        .chat-input:focus {
            border-color: #2fa572;
        }

        .send-btn {
            background-color: #2fa572;
            color: #0e1621;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <a href="/dashboard" class="back-btn">&larr;</a>
        <div class="chat-avatar" id="chatAvatar">?</div>
        <div class="chat-title" id="chatTitle">Chat</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <form class="chat-input-bar" id="chatForm">
        <input type="text" id="messageInput" class="chat-input" placeholder="Write a message..." required autocomplete="off">
        <button type="submit" class="send-btn">Send</button>
    </form>

    <script>
        const currentUsername = localStorage.getItem('username') || localStorage.getItem('berry_user');
        const urlParams = new URLSearchParams(window.location.search);
        const friendUsername = urlParams.get('friend');

        if (!currentUsername || !friendUsername) {
            window.location.href = '/dashboard';
        }

        document.getElementById('chatTitle').textContent = `@${friendUsername}`;
        document.getElementById('chatAvatar').textContent = friendUsername.charAt(0).toUpperCase();

        async function loadMessages() {
            try {
                const res = await fetch(`/api/messages?user=${encodeURIComponent(currentUsername)}&friend=${encodeURIComponent(friendUsername)}`);
                const data = await res.json();
                const container = document.getElementById('chatMessages');
                
                container.innerHTML = '';
                if (data.messages) {
                    data.messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = `message ${msg.sender === currentUsername ? 'sent' : 'received'}`;
                        div.textContent = msg.text;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) {}
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                const res = await fetch('/api/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: currentUsername, receiver: friendUsername, text })
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    loadMessages();
                }
            } catch (err) {}
        });

        loadMessages();
        setInterval(loadMessages, 3000); // Live poll messages every 3s
    </script>
</body>
</html>
