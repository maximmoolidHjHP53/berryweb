<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1117;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-container {
            width: 100%;
            max-width: 420px;
            background: #1e222d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            background: #252a37;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .nav-back:hover {
            color: #fff;
            background: #2b3243;
        }
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .avatar-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            position: relative;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
        }
        .username-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .badge {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .info-card {
            background: #252a37;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .info-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bio-input {
            width: 100%;
            background: #1e222d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        .bio-input:focus {
            border-color: #22c55e;
        }
        .info-value {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
        }
        .btn {
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        .btn:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <a href="/dashboard" class="nav-back"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        
        <div class="avatar-section">
            <div class="avatar-box" id="profileAvatarBox">
                <span id="profileInitial">U</span>
            </div>
            <h2 class="username-title" id="profileUsername">Username</h2>
            <span class="badge"><i class="fa-solid fa-shield-halved"></i> Active Member</span>
        </div>

        <div class="info-card">
            <div class="info-label"><i class="fa-solid fa-circle-info"></i> About / Bio</div>
            <textarea id="aboutInput" class="bio-input" rows="3" placeholder="Write something about yourself...">Hello! I am using Berryweb.</textarea>
        </div>

        <div class="info-card">
            <div class="info-label"><i class="fa-solid fa-calendar-days"></i> Registration Record Date</div>
            <div class="info-value" id="regDate">Loading record date...</div>
        </div>

        <button class="btn" onclick="saveProfile()"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');

        if (!currentUser) {
            window.location.href = '/login';
        } else {
            const usernameEl = document.getElementById('profileUsername');
            if (usernameEl) usernameEl.textContent = currentUser;
            const initialEl = document.getElementById('profileInitial');
            if (initialEl) initialEl.textContent = currentUser.charAt(0).toUpperCase();
        }

        // Fetch user profile data from server on load
        socket.emit('get_user_data', currentUser);

        socket.on('user_data_response', (data) => {
            if (data.bio) {
                document.getElementById('aboutInput').value = data.bio;
            }
            const regDateEl = document.getElementById('regDate');
            if (regDateEl) {
                regDateEl.textContent = data.regDate || 'August 5, 2026';
            }
            if (data.avatar) {
                const avatarBox = document.getElementById('profileAvatarBox');
                if (avatarBox) {
                    avatarBox.innerHTML = `<img src="${data.avatar}" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                }
            }
        });

        function saveProfile() {
            const bio = document.getElementById('aboutInput').value;
            const avatarImg = document.querySelector('#profileAvatarBox img');
            const avatar = avatarImg ? avatarImg.src : '';

            // Emit update to server socket
            socket.emit('update_profile', { username: currentUser, bio, avatar });

            // Store locally for instant fallback
            localStorage.setItem('bio_' + currentUser, bio);
            if (avatar) localStorage.setItem('avatar_' + currentUser, avatar);

            alert("Profile updated and saved successfully!");
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
