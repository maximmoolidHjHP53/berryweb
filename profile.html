<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Profile Settings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f1117; color: #ffffff; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            animation: fadeInPage 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0;
        }
        @keyframes fadeInPage { to { opacity: 1; } }

        a, button, .btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        a:hover, button:hover { transform: translateY(-2px); }

        .profile-container {
            width: 100%; max-width: 440px; background: #1e222d;
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
            padding: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .nav-back {
            display: inline-flex; align-items: center; gap: 8px; color: #94a3b8;
            text-decoration: none; font-size: 13px; font-weight: 600; margin-bottom: 20px;
            background: #252a37; padding: 8px 14px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .nav-back:hover { color: #fff; background: #2b3243; }

        .avatar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .avatar-box {
            width: 100px; height: 100px; border-radius: 50%; background: #22c55e;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            font-weight: bold; color: white; overflow: hidden; border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35); margin-bottom: 12px;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        .username-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .badge {
            background: rgba(34, 197, 94, 0.15); color: #22c55e; font-size: 11px;
            font-weight: bold; padding: 4px 10px; border-radius: 20px;
        }

        .info-card {
            background: #252a37; border-radius: 14px; padding: 15px; margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .info-label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .bio-input, .url-input {
            width: 100%; background: #1e222d; border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; padding: 12px; color: white; font-size: 14px; outline: none;
        }
        .bio-input:focus, .url-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
        .info-value { font-size: 15px; font-weight: 500; color: #ffffff; }

        .file-upload-btn {
            display: block; width: 100%; text-align: center; background: #334155;
            color: white; padding: 11px; border-radius: 10px; font-size: 13px;
            font-weight: 600; cursor: pointer; border: 1px dashed rgba(255,255,255,0.2); margin-top: 8px;
        }
        .file-upload-btn:hover { background: #475569; }

        #cropContainer { display: none; margin-top: 10px; text-align: center; }
        .zoom-slider { width: 100%; margin-top: 8px; accent-color: #22c55e; }

        .btn {
            width: 100%; background: #22c55e; color: white; border: none; padding: 13px;
            border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        .btn:hover { background: #16a34a; }

        /* Success Modal Popup */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #1e222d; border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 360px;
            text-align: center; transform: scale(0.75); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-backdrop.active .modal-content { transform: scale(1); }
        @keyframes bounceIcon { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    </style>
</head>
<body>

    <div class="profile-container">
        <a href="/dashboard" class="nav-back">&larr; Back to Dashboard</a>
        
        <div class="avatar-section">
            <div class="avatar-box" id="profileAvatarBox">
                <span id="profileInitial">U</span>
            </div>
            <h2 class="username-title" id="profileUsername">Username</h2>
            <span class="badge">Active Member</span>
        </div>

        <div class="info-card">
            <div class="info-label">Profile Picture Photo Editor</div>
            <input type="text" id="avatarInput" class="url-input" autocomplete="off" placeholder="Paste image URL here..." oninput="previewAvatar(this.value)">
            <label class="file-upload-btn">
                📁 Choose Real Photo From Device
                <input type="file" id="deviceImageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </label>
            
            <div id="cropContainer">
                <p style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Adjust Crop & Zoom:</p>
                <canvas id="cropCanvas" width="160" height="160" style="border-radius: 50%; border: 2px solid #22c55e; cursor: grab;"></canvas>
                <input type="range" id="zoomSlider" class="zoom-slider" min="0.5" max="3" step="0.05" value="1" oninput="drawCroppedImage()">
                <button onclick="applyCrop()" style="margin-top: 8px; background: #22c55e; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">Crop & Save Photo</button>
            </div>
        </div>

        <div class="info-card">
            <div class="info-label">About / Bio</div>
            <textarea id="aboutInput" class="bio-input" rows="3" autocomplete="off" placeholder="Write something about yourself..."></textarea>
        </div>

        <div class="info-card">
            <div class="info-label">Registration Date</div>
            <div class="info-value" id="regDate">Loading...</div>
        </div>

        <button class="btn" onclick="saveProfile()">Save Changes</button>
    </div>

    <div id="successModal" class="modal-backdrop">
        <div class="modal-content">
            <div style="font-size: 48px; margin-bottom: 12px; animation: bounceIcon 0.6s ease infinite alternate;">🎉</div>
            <h3 style="font-size: 22px; margin-bottom: 8px; color: #fff;">Profile Saved Successfully!</h3>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.4;">Your profile picture and changes are permanently saved across Berryweb.</p>
            <button onclick="closeSuccessModal()" style="width: 100%; padding: 12px; background: #22c55e; border: none; color: white; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px;">Awesome, Go to Dashboard</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const socket = io(window.location.origin, {
    path: '/socket.io',
    transports: ['polling', 'websocket'],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
});

        const currentUser = localStorage.getItem('username') || localStorage.getItem('berry_user');
        let loadedImage = null;
        let imgX = 0, imgY = 0, isDragging = false, startX, startY;

        if (!currentUser) {
            window.location.href = '/login';
        } else {
            document.getElementById('profileUsername').textContent = currentUser;
            document.getElementById('profileInitial').textContent = currentUser.charAt(0).toUpperCase();
        }

        socket.emit('get_user_data', currentUser);

        socket.on('user_data_response', (data) => {
            if (data.bio) document.getElementById('aboutInput').value = data.bio;
            if (data.regDate) document.getElementById('regDate').textContent = data.regDate;
            if (data.avatar) {
                document.getElementById('avatarInput').value = data.avatar;
                document.getElementById('profileAvatarBox').innerHTML = `<img src="${data.avatar}" alt="Avatar">`;
            }
        });

        function previewAvatar(url) {
            if (url.trim() !== '') {
                document.getElementById('profileAvatarBox').innerHTML = `<img src="${url}" alt="Avatar">`;
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    loadedImage = new Image();
                    loadedImage.onload = function() {
                        document.getElementById('cropContainer').style.display = 'block';
                        imgX = 0; imgY = 0;
                        drawCroppedImage();
                    };
                    loadedImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');

        function drawCroppedImage() {
            if (!loadedImage) return;
            const zoom = parseFloat(document.getElementById('zoomSlider').value);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2 + imgX, canvas.height / 2 + imgY);
            ctx.scale(zoom, zoom);
            const w = loadedImage.width;
            const h = loadedImage.height;
            const size = Math.min(w, h);
            ctx.drawImage(loadedImage, (w - size) / 2, (h - size) / 2, size, size, -80, -80, 160, 160);
            ctx.restore();
        }

        canvas.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - imgX; startY = e.clientY - imgY; });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            imgX = e.clientX - startX;
            imgY = e.clientY - startY;
            drawCroppedImage();
        });

        function applyCrop() {
            const dataURL = canvas.toDataURL('image/png');
            document.getElementById('avatarInput').value = dataURL;
            document.getElementById('profileAvatarBox').innerHTML = `<img src="${dataURL}" alt="Avatar">`;
            document.getElementById('cropContainer').style.display = 'none';
        }

        function saveProfile() {
            const bio = document.getElementById('aboutInput').value;
            const avatar = document.getElementById('avatarInput').value;

            socket.emit('update_profile', { username: currentUser, bio, avatar });
            document.getElementById('successModal').classList.add('active');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.remove('active');
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
