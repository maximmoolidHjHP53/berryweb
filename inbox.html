<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - BerryWeb</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1621;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: #17212b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
        }

        .back-link {
            color: #2fa572;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .request-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #2fa572;
            color: #0e1621;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-transform: uppercase;
        }

        .req-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-accept {
            background-color: #2fa572;
            color: #0e1621;
        }

        .btn-decline {
            background-color: #eb5757;
            color: #fff;
        }

        .no-requests {
            color: #8a96a3;
            text-align: center;
            font-size: 14px;
            padding: 20px 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header-row">
                <h2>Friend Requests Inbox</h2>
                <a href="/dashboard" class="back-link">&larr; Dashboard</a>
            </div>

            <ul id="requestList" class="request-list">
                <li class="no-requests">Loading requests...</li>
            </ul>
        </div>
    </div>

    <script>
        const currentUsername = localStorage.getItem('username') || localStorage.getItem('berry_user');
        if (!currentUsername) window.location.href = '/login';

        async function loadRequests() {
            try {
                const res = await fetch(`/api/friend-requests?user=${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                const listEl = document.getElementById('requestList');

                listEl.innerHTML = '';
                if (data.requests && data.requests.length > 0) {
                    data.requests.forEach(sender => {
                        const li = document.createElement('li');
                        li.className = 'request-item';
                        li.innerHTML = `
                            <div class="user-info">
                                <div class="avatar">${sender.charAt(0)}</div>
                                <span>@${sender}</span>
                            </div>
                            <div class="req-buttons">
                                <button class="btn btn-accept" onclick="respondRequest('${sender}', 'accept')">Accept</button>
                                <button class="btn btn-decline" onclick="respondRequest('${sender}', 'decline')">Decline</button>
                            </div>
                        `;
                        listEl.appendChild(li);
                    });
                } else {
                    listEl.innerHTML = `<li class="no-requests">No pending friend requests.</li>`;
                }
            } catch (err) {
                document.getElementById('requestList').innerHTML = `<li class="no-requests">Failed to load requests.</li>`;
            }
        }

        async function respondRequest(senderUsername, action) {
            try {
                const res = await fetch('/api/respond-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, senderUsername, action })
                });
                const data = await res.json();
                if (data.success) {
                    loadRequests();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Action failed.");
            }
        }

        loadRequests();
    </script>
</body>
</html>
