<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-elevation: 0 16px 50px rgba(0, 0, 0, 0.7);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #131e2b 0%, #0e1621 100%);
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-elevation);
            backdrop-filter: blur(16px);
            animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-green), #1b6343);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px auto;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 6px 20px rgba(47, 165, 114, 0.35);
        }

        .auth-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .input-group input {
            width: 100%;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            border-radius: 12px;
            padding: 13px 14px 13px 42px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 14px rgba(47, 165, 114, 0.2);
            background: var(--bg-tertiary);
        }

        .input-group input:focus + i,
        .input-field-wrapper:focus-within i {
            color: var(--accent-green);
        }

        .security-badge {
            font-size: 0.75rem;
            color: var(--accent-green);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .auth-btn {
            width: 100%;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(47, 165, 114, 0.3);
        }

        .auth-btn:hover {
            background: var(--accent-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(47, 165, 114, 0.45);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(235, 87, 87, 0.1);
            border: 1px solid rgba(235, 87, 87, 0.2);
            color: #eb5757;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Smooth Page Entry Transition */
body {
    animation: fadeInPage 0.4s ease-in-out forwards;
    opacity: 0;
}
@keyframes fadeInPage {
    to { opacity: 1; }
}


    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Secure Berryweb Authentication Portal</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <div class="security-badge"><i class="fa-solid fa-lock"></i> End-to-end credential verification</div>
            </div>

            <button type="submit" class="auth-btn">Log In Securely</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    
    errorMsg.style.display = 'none';

    if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match!';
        errorMsg.style.display = 'block';
        return;
    }

    // Helper function to handle fetch with auto-retries for sleeping servers
    const fetchWithRetry = async (url, options, retries = 3, delay = 3000) => {
        for (let i = 0; i < retries; i++) {
            try {
                const res = await fetch(url, options);
                return res;
            } catch (err) {
                if (i === retries - 1) throw err;
                errorMsg.textContent = `Server waking up... retrying (${i + 1}/${retries})...`;
                errorMsg.style.display = 'block';
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    };

    try {
        const response = await fetchWithRetry('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();

        if (data.success) {
            localStorage.setItem('berry_user', username);
            localStorage.setItem('username', username);
            window.location.href = '/dashboard';
        } else {
            errorMsg.textContent = data.message || 'Registration failed.';
            errorMsg.style.display = 'block';
        }
    } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
    }
});


    </script>
</body>
</html>
