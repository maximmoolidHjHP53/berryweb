<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram - Secure Login</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid #334155; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            animation: fadeInSlide 0.5s ease-out forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 35px -5px rgba(56, 189, 248, 0.15);
        }
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-area { text-align: center; margin-bottom: 24px; }
        .logo-area h2 { margin: 0; color: #38bdf8; font-size: 1.6rem; font-weight: 700; }
        .logo-area p { color: #94a3b8; font-size: 0.85rem; margin-top: 6px; }

        .input-group { margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        input { 
            width: 100%; 
            background: #0f172a; 
            border: 1px solid #334155; 
            padding: 12px 14px; 
            border-radius: 10px; 
            color: #fff; 
            outline: none; 
            font-size: 0.95rem; 
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }
        
        .eye-btn { 
            position: absolute; 
            right: 12px; 
            background: transparent; 
            border: none; 
            color: #94a3b8; 
            cursor: pointer; 
            font-size: 0.9rem; 
            padding: 4px;
        }
        .eye-btn:hover { color: #fff; }

        .helper-text { font-size: 0.75rem; color: #64748b; margin-top: 5px; display: block; }
        .helper-text.error { color: #f43f5e; }

        .submit-btn { 
            width: 100%; 
            background: #2563eb; 
            color: #fff; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1rem; 
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        .submit-btn:hover { background: #1d4ed8; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .footer-link a:hover { text-decoration: underline; color: #7dd3fc; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-area">
            <h2>Welcome Back</h2>
            <p>Log in to access your secure chat dashboard</p>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="off" oninput="checkFormState()">
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Enter your password" oninput="checkFormState()">
                <button type="button" class="eye-btn" onclick="togglePass('password', this)">👁️</button>
            </div>
            <span id="login-error" class="helper-text error"></span>
        </div>

        <button type="button" id="submit-btn" class="submit-btn" onclick="submitLogin()" disabled>Log In</button>

        <div class="footer-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        function togglePass(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function checkFormState() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('submit-btn');
            btn.disabled = !(user.length > 0 && pass.length > 0);
        }

        async function submitLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorSpan = document.getElementById('login-error');
            errorSpan.textContent = "";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('chat_user', username);
                    window.location.href = '/dashboard';
                } else {
                    errorSpan.textContent = "❌ " + (data.message || "Invalid login credentials.");
                }
            } catch (err) {
                errorSpan.textContent = "❌ Network error connecting to server.";
            }
        }
    </script>
</body>
</html>
