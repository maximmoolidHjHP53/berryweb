<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--bg-secondary); border: 1px solid var(--border-glass); padding: 35px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .auth-card h2 { font-size: 1.6rem; margin-bottom: 24px; text-align: center; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input { width: 100%; background: var(--bg-primary); border: 1.5px solid var(--border-glass); border-radius: 12px; padding: 12px; color: var(--text-main); font-size: 0.95ln; outline: none; transition: var(--transition-smooth); }
        .input-group input:focus { border-color: var(--accent-green); }
        .auth-btn { width: 100%; background: var(--accent-green); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: var(--transition-smooth); margin-top: 10px; }
        .auth-btn:hover { background: var(--accent-green-hover); transform: translateY(-1px); }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-footer a { color: var(--accent-green); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg { color: #eb5757; font-size: 0.85rem; text-align: center; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back</h2>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="auth-btn">Log In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (data.success) {
                localStorage.setItem('berry_user', username);
                localStorage.setItem('username', username);
                window.location.href = '/dashboard';
            } else {
                alert(data.message || 'Invalid username or password.');
            }
        } catch (err) {
            alert('Connection error. Please try again.');
        }
    });
</script>

</body>
</html>
