<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BerryWeb</title>
    <style>
        /* Page Load Hover / Fade-in Animation */
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            animation: pageFadeIn 0.6s ease-out forwards;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover transition effect for the container card */
        .container:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
        }

        button {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        .back-btn {
            background: #6c757d;
            margin-top: 8px;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        #errorMsg {
            color: red;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🍇</div>
        <h2>Create Account</h2>
        
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Create secure password" required>
                <span id="togglePassword" class="eye-icon">👁️</span>
            </div>

            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm secure password" required>
                <span id="toggleConfirm" class="eye-icon">👁️</span>
            </div>

            <div id="errorMsg"></div>
            
            <button type="submit">Register Securely</button>
            
            <button type="button" class="back-btn" onclick="window.location.href='/login'">Back to Login</button>
        </form>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleConfirm = document.getElementById('toggleConfirm');
        const confirmInput = document.getElementById('confirmPassword');

        // Toggle Password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        // Toggle Confirm Password visibility
        toggleConfirm.addEventListener('click', () => {
            const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmInput.setAttribute('type', type);
            toggleConfirm.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        // Registration Submission Handler with Ultra-Secure Validation
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            // High Security Regex: Minimum 8 characters, at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special symbol
            const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!strongPasswordRegex.test(password)) {
                errorMsg.textContent = 'Password must be 8+ chars and include uppercase, lowercase, number & special symbol!';
                errorMsg.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match!';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('berry_user', username);
                    localStorage.setItem('username', username);
                    window.location.href = '/policy';
                } else {
                    errorMsg.textContent = data.message || 'Registration failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
