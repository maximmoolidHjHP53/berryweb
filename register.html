<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berryweb - Secure Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-tertiary: #242f3d;
            --accent-green: #2fa572;
            --accent-green-hover: #23855a;
            --text-main: #f5f5f5;
            --text-muted: #8a96a3;
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-elevation: 0 16px 50px rgba(0, 0, 0, 0.7);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-elevation);
            backdrop-filter: blur(12px);
        }

        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-header h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
        .auth-header p { font-size: 0.85rem; color: var(--text-muted); }

        .input-group { margin-bottom: 18px; position: relative; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        
        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px 14px 12px 42px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(47, 165, 114, 0.2);
        }

        .security-badge {
            font-size: 0.75rem;
            color: var(--accent-green);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .auth-btn {
            width: 100%;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(47, 165, 114, 0.3);
        }

        .auth-btn:hover {
            background: var(--accent-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(47, 165, 114, 0.4);
        }

        .auth-footer { text-align: center; margin-top: 22px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-footer a { color: var(--accent-green); text-decoration: none; font-weight: 600; transition: var(--transition-smooth); }
        .auth-footer a:hover { text-decoration: underline; }

        .error-msg {
            background: rgba(235, 87, 87, 0.1);
            border: 1px solid rgba(235, 87, 87, 0.2);
            color: #eb5757;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Secure encrypted registration</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="registerForm">
            <div class="input-group">
                <label>Username</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" required placeholder="Choose a username">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="Create secure password">
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="confirmPassword" required placeholder="Confirm secure password">
                </div>
                <div class="security-badge"><i class="fa-solid fa-lock"></i> 256-bit encrypted validation</div>
            </div>

            <button type="submit" class="auth-btn">Register Securely</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Log in here</a>
        </div>
    </div>

    <script>
      
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    
    errorMsg.style.display = 'none';

    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();

        if (data.success) {
            localStorage.setItem('berry_user', username);
            localStorage.setItem('username', username);
            window.location.href = '/dashboard';
        } else {
            errorMsg.textContent = data.message || 'Login failed.';
            errorMsg.style.display = 'block';
        }
    } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
    }
});
</script>
</body>
</html>
