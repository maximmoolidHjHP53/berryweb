<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BerryWeb</title>
    <style>
        /* Page Entry Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1621; /* Dark theme background */
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            animation: fadeIn 0.5s ease-out;
        }

        .auth-card {
            background-color: #17212b; /* Secondary dark card background */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 360px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 255, 136, 0.15); /* Subtle green glow on hover */
            border-color: #2fa572;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 8px rgba(47, 165, 114, 0.5));
        }

        /* Persuasive Value Proposition Text to attract users */
        .value-prop {
            font-size: 15px;
            color: #8a96a3;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #f5f5f5;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #8a96a3;
            margin-bottom: 6px;
        }

        .input-field-wrapper {
            position: relative;
            width: 100%;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a96a3;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px 12px 40px; /* Space for icon on left */
            background-color: #0e1621;
            border: 1px solid #374151;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: #f5f5f5;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2fa572; /* Green focus color */
            box-shadow: 0 0 0 2px rgba(47, 165, 114, 0.3);
            outline: none;
        }

        .password-wrapper input {
            padding-right: 45px; /* Space for eye icon */
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #8a96a3;
            font-size: 16px;
            user-select: none;
        }

        .eye-icon:hover {
            color: #f5f5f5;
        }

        /* Green Security Badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #2fa572;
            margin-bottom: 18px;
            gap: 6px;
        }

        .security-badge i {
            font-size: 11px;
        }

        button.auth-btn {
            width: 100%;
            background-color: #2fa572; /* Green action button */
            color: #0e1621;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.auth-btn:hover {
            background-color: #289264;
        }
        
        button.auth-btn:active {
            transform: scale(0.98);
        }

        button.back-btn {
            background-color: transparent;
            border: 1px solid #374151;
            color: #8a96a3;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        button.back-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #f5f5f5;
            border-color: #4b5563;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #8a96a3;
        }

        .auth-footer a {
            color: #2fa572;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        #errorMsg {
            color: #eb5757;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo">🍇</div>
        
        <p class="value-prop">Join BerryWeb today for instant access to secure, encrypted registration. Simple, private, and built for your digital life.</p>

        <h2>Create Account</h2>

        <form id="registerForm">
            <div id="errorMsg"></div>

            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-field-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" required placeholder="Choose a username" minlength="3">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper input-field-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Create secure password" minlength="8">
                    <span id="togglePassword" class="eye-icon">👁️</span>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper input-field-wrapper">
                    <i class="fas fa-shield-halved"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm secure password">
                    <span id="toggleConfirm" class="eye-icon">👁️</span>
                </div>
            </div>

            <div class="security-badge">
                <i class="fas fa-lock"></i> 256-bit encrypted validation
            </div>

            <button type="submit" class="auth-btn">Register Securely</button>
            
            <button type="button" class="back-btn" onclick="window.location.href='/login'">Back to Login</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Log in here</a>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>

    <script>
        // --- Ironclad Registration Guard: Prevent visiting register if already logged in ---
const activeUser = localStorage.getItem('berry_session_user') || localStorage.getItem('username');
if (activeUser) {
    window.location.replace('/dashboard');
}

      
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleConfirm = document.getElementById('toggleConfirm');
        const confirmInput = document.getElementById('confirmPassword');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        toggleConfirm.addEventListener('click', () => {
            const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmInput.setAttribute('type', type);
            toggleConfirm.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            // High Security Regex: 8+ chars, uppercase, lowercase, number, special symbol
            const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!strongPasswordRegex.test(password)) {
                errorMsg.textContent = 'Password must be 8+ chars and include uppercase, lowercase, number & special symbol!';
                errorMsg.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match!';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('berry_user', username);
                    localStorage.setItem('username', username);
                    window.location.href = '/policy';
                } else {
                    errorMsg.textContent = data.message || 'Registration failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error('Fetch error:', err);
                errorMsg.textContent = 'Network or server connection error!';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
