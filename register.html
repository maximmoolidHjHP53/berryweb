<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BerryWeb</title>
    <style>
        /* Page Load Entry Animation */
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
            animation: pageFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .container {
            background: #1f293d;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 330px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        /* Hover Transition Effect */
        .container:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(110, 68, 255, 0.25);
            border-color: rgba(110, 68, 255, 0.4);
        }

        .logo {
            font-size: 38px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.6));
        }

        h2 {
            margin-bottom: 24px;
            color: #f3f4f6;
            font-size: 24px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: #fff;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
            outline: none;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            color: #9ca3af;
            user-select: none;
            transition: color 0.2s;
        }

        .eye-icon:hover {
            color: #fff;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            transition: all 0.25s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #6d28d9, #5b21b6);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.6);
            transform: translateY(-1px);
        }

        .back-btn {
            background: transparent;
            border: 1px solid #4b5563;
            color: #d1d5db;
            box-shadow: none;
            margin-top: 8px;
        }

        .back-btn:hover {
            background: rgba(75, 85, 99, 0.2);
            color: #fff;
            border-color: #6b7280;
            box-shadow: none;
        }

        #errorMsg {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🍇</div>
        <h2>Create Account</h2>
        
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Create secure password" required>
                <span id="togglePassword" class="eye-icon">👁️</span>
            </div>

            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm secure password" required>
                <span id="toggleConfirm" class="eye-icon">👁️</span>
            </div>

            <div id="errorMsg"></div>
            
            <button type="submit">Register Securely</button>
            
            <button type="button" class="back-btn" onclick="window.location.href='/login'">Back to Login</button>
        </form>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleConfirm = document.getElementById('toggleConfirm');
        const confirmInput = document.getElementById('confirmPassword');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        toggleConfirm.addEventListener('click', () => {
            const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmInput.setAttribute('type', type);
            toggleConfirm.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            // High Security Regex: Minimum 8 characters, at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special symbol
            const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!strongPasswordRegex.test(password)) {
                errorMsg.textContent = 'Password must be 8+ chars and include uppercase, lowercase, number & special symbol!';
                errorMsg.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match!';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('berry_user', username);
                    localStorage.setItem('username', username);
                    window.location.href = '/policy';
                } else {
                    errorMsg.textContent = data.message || 'Registration failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
